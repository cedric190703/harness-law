const data={"schema_version": 1, "mission": {"title": "Projet Ridgeline", "client": "Équipe acquéreur", "scope": "Exemple de revue partielle du financement, des contentieux et des contrats commerciaux.", "as_of": "2025-01-08"}, "generated_at": "2026-10-04T12:31:50.804215+00:00", "documents": [{"id": "P-aa746d7d05db", "path": "confidential-information-memorandum.txt", "sha256": "9671eee7bad7b90012173fc892a4a103415e048cafdfbeb468a3091230bddb6e", "units": ["================================================================================\n                    CONFIDENTIAL INFORMATION MEMORANDUM\n================================================================================\n\n                             PROJECT RIDGELINE\n\n                    ROCKY ENVIRONMENTAL SERVICES, INC.\n\n                        Salt Lake City, Utah\n\n                            Prepared: December 2024\n\n--------------------------------------------------------------------------------\nCONFIDENTIALITY AND DISCLAIMER\n--------------------------------------------------------------------------------\n\nThis Confidential Information Memorandum (this \"Memorandum\") has been prepared\nby Rocky Environmental Services, Inc. (\"RES,\" the \"Company,\" or \"we\") and\nCertain Point Partners LLC (\"Financial Advisor\") solely for the benefit of\nprospective purchasers (each, a \"Recipient\") who have executed a\nconfidentiality agreement with the Company or its Financial Advisor in\nconnection with the proposed transaction described herein (the \"Transaction\").\n\nThis Memorandum contains confidential and proprietary information regarding\nthe Company. By accepting delivery of this Memorandum, each Recipient agrees\nthat it will hold the contents hereof in strict confidence and will not\ndisclose or distribute the same, in whole or in part, to any person other than\nthe Recipient's directors, officers, employees, advisors and financing sources\nwho have a need to know such information for the purpose of evaluating the\nTransaction and who agree to be bound by the confidentiality obligations\nreferenced above.\n\nThe information contained in this Memorandum has been prepared from materials\nfurnished by management and other sources believed to be reliable; however, no\nrepresentation or warranty, express or implied, is made as to the accuracy or\ncompleteness thereof, and no responsibility is assumed for any errors or\nomissions. Financial projections, estimates and forward-looking statements\ncontained herein are based upon assumptions that management believes to be\nreasonable as of the date hereof but that are inherently uncertain. Actual\nresults may differ materially.\n\nThis Memorandum does not constitute an offer to sell, or a solicitation of an\noffer to buy, any security or asset, and is not intended to form the basis of\nany investment or acquisition decision.\n\n--------------------------------------------------------------------------------\nTABLE OF CONTENTS\n--------------------------------------------------------------------------------\n\n1.  Executive Summary\n2.  Company Overview\n3.  Investment Highlights\n4.  Service Lines\n5.  Historical Financial Results\n6.  Adjusted EBITDA\n7.  Customer Overview and Concentration\n8.  Facilities and Real Estate\n9.  Employees and Organization\n10. Fleet and Equipment\n11. Historical Capital Expenditures\n12. Growth Opportunities\n13. Technology and Systems\n14. Environmental Compliance Overview\n15. Legal Overview\n16. Transaction Process and Contact\n\n--------------------------------------------------------------------------------\n1. EXECUTIVE SUMMARY\n--------------------------------------------------------------------------------\n\nRocky Environmental Services, Inc. is a leading provider of environmental\nservices, hazardous and non-hazardous waste handling, remediation, industrial\nfield services and specialized transportation to a diversified base of\ncommercial, industrial and governmental customers across the Intermountain\nWest. Headquartered in Salt Lake City, Utah, the Company operates a network of\npermitted facilities, transfer stations and field-service locations serving\ncustomers in Utah, Colorado, Wyoming, Idaho, Nevada and Montana.\n\nFor the trailing twelve months (\"TTM\") ended September 30, 2024, the Company\ngenerated revenue of approximately $127.1 million and Adjusted EBITDA of\n$22.8 million. The Company's results reflect a resilient, recurring revenue\nbase, a highly experienced field workforce, a modern fleet and a demonstrated\nability to win and retain large, complex and technically demanding\nenvironmental projects.\n\nThe Company is being offered for sale in a sale process being conducted by its\nFinancial Advisor, Certain Point Partners LLC. Management believes the Company\nrepresents a compelling platform investment opportunity for a purchaser seeking\nexposure to an essential, regulation-driven industry with significant\nopportunities for organic growth and add-on acquisitions.\n\n--------------------------------------------------------------------------------\n2. COMPANY OVERVIEW\n--------------------------------------------------------------------------------\n\nFounded in 1994, RES has grown from a regional asbestos and lead abatement\ncontractor into a full-service environmental and industrial services platform.\nThe Company today provides a comprehensive suite of services spanning hazardous\nand non-hazardous waste management, emergency response, industrial cleaning and\nmaintenance, soil and groundwater remediation, and specialized bulk and\nroll-off transportation.\n\nThe Company serves a broad range of end markets, including federal and state\ngovernment agencies, mining and natural resources, refining and energy,\nmanufacturing, utilities, transportation and infrastructure, and commercial\nreal estate development.\n\nKey facts:\n\n    -  Headquarters: Salt Lake City, Utah\n    -  Founded: 1994\n    -  Employees: approximately 410, including approximately 300 field\n       technicians and operators\n    -  TTM Revenue (period ended September 30, 2024): approximately $127.1\n       million\n    -  TTM Adjusted EBITDA: $22.8 million\n    -  Facilities: 8 owned or leased facilities and field locations\n    -  Fleet: approximately 240 vehicles, trailers and pieces of heavy\n       equipment\n    -  Service area: Utah, Colorado, Wyoming, Idaho, Nevada and Montana\n\n--------------------------------------------------------------------------------\n3. INVESTMENT HIGHLIGHTS\n--------------------------------------------------------------------------------\n\nManagement believes the following attributes make RES an attractive platform\nfor investment:\n\n    (a)  Essential, regulation-driven services. Environmental and hazardous\n         waste handling services are mandated by law and are non-discretionary\n         for the Company's customers. Demand for these services is driven by\n         regulatory requirements, environmental liability management and\n         industrial activity rather than by discretionary capital spending.\n\n    (b)  Diversified, blue-chip customer base. The Company serves a diverse mix\n         of federal, state and local government agencies and Fortune 500\n         industrial customers. The Company's top ten customers represented\n         approximately 67% of TTM revenue.\n\n    (c)  Strong recurring revenue. A significant portion of the Company's\n         revenue is generated under multi-year master service agreements,\n         standing offer agreements, government contracts and annual\n         service arrangements.\n\n    (d)  Unique, hard-to-replicate infrastructure. The Company's permitted\n         facilities and transfer stations represent difficult-to-replicate\n         infrastructure with substantial barriers to entry.\n\n    (e)  Experienced management team. The Company is led by a seasoned\n         management team with an average of more than 18 years of industry\n         experience and a demonstrated track record of growth.\n\n    (f)  Multiple growth levers. Identified opportunities include expansion of\n         treatment and disposal capabilities, geographic expansion, pricing\n--------------------------------------------------------------------------------\n4. SERVICE LINES\n--------------------------------------------------------------------------------\n\nThe Company delivers its services through six integrated service lines:\n\n    (a)  Hazardous and Non-Hazardous Waste Management. Collection, packaging,\n         transportation, treatment, stabilization and disposal of hazardous and\n         non-hazardous industrial waste, including profiling, manifesting and\n         brokered disposal. Approximately 34% of TTM revenue.\n\n    (b)  Remediation and Environmental Construction. Soil and groundwater\n         remediation, excavation, in-situ treatment, vapor intrusion mitigation\n         and site restoration for industrial, energy and government clients.\n         Approximately 22% of TTM revenue.\n\n    (c)  Industrial and Field Services. Industrial cleaning, vacuum truck\n         services, hydro-excavation, tank cleaning, confined-space entry and\n         turnaround support. Approximately 21% of TTM revenue.\n\n    (d)  Transportation and Logistics. Specialized bulk, roll-off, and\n         over-the-road transportation of regulated and non-regulated materials.\n         Approximately 13% of TTM revenue.\n\n    (e)  Emergency Response. 24/7 emergency spill response, incident\n         remediation and disaster recovery services. Approximately 6% of TTM\n         revenue.\n\n    (f)  Disposal and Treatment Facility Services. Operation of permitted\n         transfer, treatment and storage facilities serving internal and\n         third-party volumes. Approximately 4% of TTM revenue.\n\nNote: The Company historically provided asbestos and lead abatement services\nfrom 2012 through 2023. That service line has been fully exited, and the\nCompany no longer performs asbestos abatement or related regulated abatement\nwork.\n\n--------------------------------------------------------------------------------\n5. HISTORICAL FINANCIAL RESULTS\n--------------------------------------------------------------------------------\n\nThe following table summarizes the Company's historical financial performance.\nAmounts are in thousands of dollars and reflect the Company's historical\naccounting practices.\n\n                                        FY2021     FY2022     FY2023     TTM(1)\n                                        -------    -------    -------    -------\n    Revenue                             $ 98,420   $112,610   $121,340   $127,100\n    Gross Profit                        $ 27,560   $ 32,180   $ 35,020   $ 37,140\n    Gross Margin                             28.0%      28.6%      28.9%      29.2%\n    Reported EBITDA                     $ 13,900   $ 15,800   $ 17,600   $ 18,400\n    Adjusted EBITDA                     $ 16,900   $ 19,400   $ 21,600   $ 22,800\n\n    (1) Trailing twelve months ended September 30, 2024.\n\nThe Company has delivered consistent revenue growth and margin expansion, driven\nby strong demand for regulated waste and remediation services, disciplined\npricing and operating leverage across its fixed cost base.\n\n--------------------------------------------------------------------------------\n6. ADJUSTED EBITDA\n--------------------------------------------------------------------------------\n\nManagement believes that Adjusted EBITDA provides a meaningful measure of the\nCompany's ongoing operating performance. For the trailing twelve months ended\nSeptember 30, 2024, Adjusted EBITDA was $22.8 million, as compared to reported\nEBITDA of $18.4 million. Management's adjustments principally reflect items\nthat management considers to be non-recurring or non-operational in nature,\nincluding owner compensation normalization, costs associated with the\nCompany's enterprise resource planning implementation, transaction-related\nexpenses arising from the Pinnacle acquisition integration, the wind-down of\nthe asbestos abatement service line, and a historical litigation settlement\nunrelated to ongoing operations.\n\n--------------------------------------------------------------------------------\n7. CUSTOMER OVERVIEW AND CONCENTRATION\n--------------------------------------------------------------------------------\n\nThe Company serves a diversified base of federal, state and local government\nagencies and blue-chip commercial and industrial customers. No single customer\nrepresented a majority of revenue. The Company's top ten customers accounted\nfor approximately 67% of TTM revenue.\n\nNotable customer relationships include:\n\n    Customer                        TTM Revenue    % of TTM Revenue\n    ----------------------------    -----------    ----------------\n    U.S. Department of Energy       $ 24.4M              19.2%\n    Consolidated Mining Corp.       $ 14.5M              11.4%\n    Top 10 customers (aggregate)    $ 85.2M              67.0%\n\nThe U.S. Department of Energy relationship is conducted pursuant to a long-term\ncontract with remaining ceiling capacity, and the Company believes this\nrelationship is well-positioned for renewal and expansion. The Company also\nmaintains long-standing relationships with several large industrial and mining\n--------------------------------------------------------------------------------\n8. FACILITIES AND REAL ESTATE\n--------------------------------------------------------------------------------\n\nThe Company operates a network of owned and leased facilities. Key locations\ninclude:\n\n    Facility                          Location              Tenure\n    --------------------------------  --------------------  --------------\n    Corporate HQ / Field Ops          Salt Lake City, UT    Leased\n    Salt Lake City Transfer Station   Salt Lake City, UT    Leased\n    Grand Junction Industrial Yard    Grand Junction, CO    Owned\n    Casper Field Services             Casper, WY            Leased\n    Idaho Falls Field Office          Idaho Falls, ID       Leased\n    Elko Field Office                 Elko, NV              Leased\n    Rifle Equipment Yard              Rifle, CO             Leased\n    Billings Field Office             Billings, MT          Leased\n\nThe Company's Grand Junction, Colorado owner-occupied industrial property\ncomprises approximately 9.5 acres with a shop, maintenance building and yard.\nThe property is used for equipment storage, maintenance and field-service\nstaging.\n\n--------------------------------------------------------------------------------\n9. EMPLOYEES AND ORGANIZATION\n--------------------------------------------------------------------------------\n\nThe Company employs approximately 410 people, including approximately 300 field\ntechnicians and operators, approximately 60 administrative and support\npersonnel, and approximately 50 management and supervisory personnel. The\nCompany maintains a comprehensive safety program and reports a Total Recordable\nIncident Rate (TRIR) below the industry average.\n\nThe Company's workforce is non-union. The Company believes its employee\nrelations are good and maintains competitive compensation and benefits\nprograms. The Company sponsors a safe harbor 401(k) plan and comprehensive\nhealth and welfare benefits.\n\n--------------------------------------------------------------------------------\n10. FLEET AND EQUIPMENT\n--------------------------------------------------------------------------------\n\nThe Company owns and operates a fleet of approximately 240 vehicles, trailers\nand pieces of heavy equipment, including vacuum trucks, tankers, roll-off\ntrucks, hydro-excavators, dump trucks, tractor-trailers, service trucks and\nspecialized remediation equipment. The average age of the fleet is\napproximately 8.2 years. The Company generally targets a 7-year replacement\ncycle for its over-the-road vehicles and a longer cycle for certain heavy\nequipment and specialty assets.\n\n--------------------------------------------------------------------------------\n11. HISTORICAL CAPITAL EXPENDITURES\n--------------------------------------------------------------------------------\n\nThe Company's historical capital expenditures are summarized below (in\nthousands):\n\n                                        FY2021     FY2022     FY2023     TTM\n                                        -------    -------    -------    -------\n    Growth capex                        $  1,240   $  2,100   $  1,850   $  2,400\n    Maintenance capex                   $  3,980   $  4,180   $  4,050   $  4,320\n    Total capital expenditures          $  5,220   $  6,280   $  5,900   $  6,720\n\nManagement estimates normalized maintenance capital expenditures of\n--------------------------------------------------------------------------------\n12. GROWTH OPPORTUNITIES\n--------------------------------------------------------------------------------\n\nManagement has identified several opportunities to accelerate growth and\nenhance margins:\n\n    (a)  Expansion of treatment and disposal capabilities at the Company's\n         permitted facilities, including additional treatment, stabilization\n         and recycling capacity.\n\n    (b)  Geographic expansion into adjacent markets in the Intermountain West,\n         leveraging existing customer relationships and field infrastructure.\n\n    (c)  Pricing initiatives across the Company's service lines to reflect the\n         full value of its regulatory compliance, responsiveness and technical\n         capability.\n\n    (d)  A robust pipeline of add-on acquisitions targeting regional waste,\n         remediation and industrial services companies.\n\n    (e)  Continued adoption of the Company's proprietary RidgeTrack platform to\n         drive operational efficiency and margin expansion.\n\n--------------------------------------------------------------------------------\n13. TECHNOLOGY AND SYSTEMS\n--------------------------------------------------------------------------------\n\nThe Company uses a suite of operational and back-office systems to manage its\nbusiness, including a recently implemented enterprise resource planning (ERP)\nplatform and a number of industry-specific tools. The Company is in the process\nof enhancing its data and reporting capabilities to support future growth.\n\nThe Company has developed internally, through its own employees, a proprietary\noperational software platform known as \"RidgeTrack.\" RidgeTrack is used across\nthe Company's operations for dispatch, waste manifesting, route scheduling,\ncustomer service and compliance record-keeping. RidgeTrack is owned and used by\nthe Company and is tailored to the Company's workflows, service lines and\nregulatory requirements.\n\n--------------------------------------------------------------------------------\n14. ENVIRONMENTAL COMPLIANCE OVERVIEW\n--------------------------------------------------------------------------------\n\nThe Company's operations are subject to extensive federal, state and local\nenvironmental laws and regulations, including those governing the handling,\ntransportation, treatment, storage and disposal of hazardous and non-hazardous\nwaste, air emissions, water discharges and remediation of contaminated sites.\n\nThe Company holds a comprehensive portfolio of environmental permits and\napprovals required to conduct its operations, including hazardous waste\npermitting for its transfer and treatment facilities, air permits, stormwater\npermits and transportation authorizations across the states in which it\noperates. The Company is committed to maintaining compliance with all\napplicable environmental requirements and invests in ongoing compliance,\ntraining, monitoring and remediation.\n\nThe Company maintains a dedicated environmental, health and safety (EHS) team\nand comprehensive environmental management systems. From time to time, the\nCompany receives inquiries and notices from regulatory agencies in the ordinary\ncourse of its business, which management addresses on an ongoing basis.\n\n--------------------------------------------------------------------------------\n15. LEGAL OVERVIEW\n--------------------------------------------------------------------------------\n\nThe Company is not currently subject to any litigation or governmental\nproceeding that management believes would have a material adverse effect on the\nCompany's business, financial condition or results of operations, other than as\nmay be disclosed in the data room. The Company maintains insurance coverage\nthat management believes is customary and adequate for a company of its size\nand industry, including general liability, automobile, workers' compensation,\numbrella/excess, property, environmental/pollution liability and directors' and\nofficers' liability coverage.\n\n--------------------------------------------------------------------------------\n16. TRANSACTION PROCESS AND CONTACT\n--------------------------------------------------------------------------------\n\nInterested parties should direct questions and requests for additional\ninformation to the Company's Financial Advisor:\n\n    Certain Point Partners LLC\n    222 South Main Street, Suite 1800\n    Salt Lake City, Utah 84101\n\n    Attn:  Rebecca Lindstrom, Managing Partner\n    Email: rlindstrom@certainpointpartners.example\n    Tel:   (801) 555-0142\n\nSycamore Capital Partners is represented in this process by Thornfield &\nAssociates LLP (Naomi Vance and Ryan Sato).\n\nThe Company reserves the right, in its sole discretion, to reject any or all\nproposals, to negotiate with any party, and to terminate or modify the process\nat any time.\n\n[End of Confidential Information Memorandum]\n\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "à examiner", "decision_reason": "", "parent": null, "consulted": false, "signature": "non vérifiée"}, {"id": "P-7e71b761ecc8", "path": "credit-agreement.txt", "sha256": "f80ed66a78db0791d1442a65aedccd800ce869414d84bbcf1b0de86e23138441", "units": ["================================================================================\n                SENIOR SECURED CREDIT AGREEMENT (EXCERPTS)\n================================================================================\n\n                          Dated as of January 17, 2023\n\n                                     among\n\n                     ROCKY ENVIRONMENTAL SERVICES, INC.,\n                                  as Borrower,\n\n                    CERTAIN SUBSIDIARIES OF THE BORROWER,\n                                as Guarantors,\n\n                                      and\n\n                         HIGH PLAINS BANK, N.A.,\n                                   as Lender\n\n--------------------------------------------------------------------------------\n                              TABLE OF CONTENTS\n--------------------------------------------------------------------------------\n\nARTICLE I    DEFINITIONS AND ACCOUNTING TERMS\nARTICLE II   THE COMMITMENTS AND CREDIT EXTENSIONS\nARTICLE III  TAXES, YIELD PROTECTION AND ILLEGALITY\nARTICLE IV   CONDITIONS PRECEDENT\nARTICLE V    REPRESENTATIONS AND WARRANTIES\nARTICLE VI   AFFIRMATIVE COVENANTS\nARTICLE VII  NEGATIVE COVENANTS\nARTICLE VIII EVENTS OF DEFAULT AND REMEDIES\nARTICLE IX   MISCELLANEOUS\n\n[This document contains selected excerpts of the Credit Agreement and is\nprovided for information purposes. Capitalized terms used but not defined herein\nhave the meanings given in the Credit Agreement.]\n\n--------------------------------------------------------------------------------\nARTICLE I - DEFINITIONS AND ACCOUNTING TERMS\n--------------------------------------------------------------------------------\n\nSECTION 1.01  Defined Terms.\n\n\"Applicable Margin\" means, with respect to SOFR Loans, 2.35% per annum, and with\nrespect to Base Rate Loans, 1.35% per annum.\n\n\"Borrower\" means Rocky Environmental Services, Inc., a Utah corporation.\n\n\"Change of Control\" means the occurrence of any of the following: (a) any\n\"person\" or \"group\" (within the meaning of Sections 13(d) and 14(d) of the\nSecurities Exchange Act of 1934) becomes the beneficial owner, directly or\nindirectly, of 35% or more of the equity interests of the Borrower entitled to\nvote for the election of directors; (b) during any period of twelve consecutive\nmonths, individuals who at the beginning of such period constituted the board of\ndirectors of the Borrower (together with any new directors whose election or\nnomination was approved by a majority of the directors then in office) cease for\nany reason to constitute a majority of the board of directors of the Borrower;\nor (c) the Borrower ceases to own, directly or indirectly, 100% of the equity\ninterests of each of its subsidiaries.\n\n\"Commitment\" means, collectively, the Revolving Commitment and the Term\nCommitment.\n\n\"Guarantors\" means each subsidiary of the Borrower that executes a Guaranty,\nincluding Pinnacle Waste Solutions, LLC.\n\n\"Indebtedness\" means, as to any Person, all obligations for borrowed money,\ncapital lease obligations, and other obligations of such Person evidenced by\nnotes, bonds or similar instruments.\n\n\"Loan Documents\" means this Agreement, the Notes, the Guaranty, the Security\nDocuments and each other document executed in connection herewith.\n\n\"Obligations\" means all advances, debts, liabilities, obligations and covenants\nof the Borrower and the other Loan Parties owing to the Lender under the Loan\nDocuments, whether now existing or hereafter arising.\n\n\"Revolving Commitment\" means the commitment of the Lender to make Revolving\nLoans in an aggregate principal amount not to exceed $15,000,000.\n\n\"Term Commitment\" means the commitment of the Lender to make the Term Loan on\nthe Closing Date in an aggregate principal amount equal to $30,000,000.\n\n\"Term Loan Maturity Date\" means January 17, 2030.\n\n\"Revolving Maturity Date\" means January 17, 2028.\n\n--------------------------------------------------------------------------------\nARTICLE II - THE COMMITMENTS AND CREDIT EXTENSIONS\n--------------------------------------------------------------------------------\n\nSECTION 2.01  The Term Loan.\n\n    (a)  Subject to the terms and conditions set forth herein, the Lender made a\n         single term loan to the Borrower on the Closing Date in the original\n         principal amount of $30,000,000 (the \"Term Loan\"). The Term Loan was\n         funded in a single drawing on January 17, 2023. Amounts repaid or\n         prepaid in respect of the Term Loan may not be reborrowed.\n\n    (b)  The Term Loan amortizes in equal quarterly installments of $375,000,\n         payable on the last Business Day of each fiscal quarter, commencing\n         March 31, 2023. The remaining unpaid principal balance of the Term Loan\n         is due and payable on the Term Loan Maturity Date.\n\n    (c)  As of December 31, 2024, the outstanding principal balance of the Term\n         Loan was $26,300,000.\n\nSECTION 2.02  The Revolving Loans.\n\n    (a)  Subject to the terms and conditions set forth herein, the Lender agrees\n         to make revolving loans (the \"Revolving Loans\") to the Borrower from\n         time to time, up to but not exceeding the Revolving Commitment. Amounts\n         borrowed and repaid under the Revolving Loans may be reborrowed.\n\n    (b)  As of December 31, 2024, the outstanding principal balance of the\n         Revolving Loans was $12,400,000.\n\nSECTION 2.03  Interest.\n\n    (a)  The Term Loan and the Revolving Loans bear interest at a rate per annum\n         equal to the applicable SOFR rate plus the Applicable Margin, or at\n         the Borrower's election, the Base Rate plus the Applicable Margin.\n\n    (b)  Interest on the Loans is payable quarterly in arrears on the last\n         Business Day of each fiscal quarter and on each maturity date.\n\nSECTION 2.04  Optional Prepayments.\n\n    (a)  The Borrower may, upon not less than five (5) Business Days' prior\n         written notice to the Lender, prepay the Revolving Loans in whole or in\n         part at any time without premium or penalty (other than customary\n         breakage costs).\n\n    (b)  The Borrower may, upon not less than five (5) Business Days' prior\n         written notice to the Lender, prepay the Term Loan in whole or in part,\n         in each case subject to Section 2.05.\n\nSECTION 2.05  Prepayment Premium.\n\n    (a)  If the Borrower prepays or repays any portion of the Term Loan\n         (whether voluntarily, involuntarily, as a result of acceleration, or\n         otherwise, and including in connection with any repayment required\n         under Section 2.06), the Borrower shall pay to the Lender, concurrently\n         therewith, a prepayment premium equal to 1.00% of the principal amount\n         of the Term Loan then being prepaid or repaid, if such prepayment or\n         repayment occurs on or prior to the third (3rd) anniversary of the\n         Closing Date.\n\n    (b)  No prepayment premium shall be payable in respect of any prepayment or\n         repayment of the Term Loan occurring after the third (3rd) anniversary\n         of the Closing Date.\n\n    (c)  The third (3rd) anniversary of the Closing Date is January 17, 2026.\n\nSECTION 2.06  Mandatory Prepayments; Change of Control.\n\n    (a)  The Borrower shall repay the Loans in full, together with accrued and\n         unpaid interest, all fees and any amounts payable under Section 2.05,\n         on the date that is five (5) Business Days after the occurrence of a\n         Change of Control.\n\n    (b)  Upon and after the occurrence of a Change of Control, the Lender's\n         commitments to make further Loans shall immediately terminate and the\n         Lender shall have no obligation to make any further credit extensions.\n\n    (c)  The Borrower shall give the Lender prompt written notice (and in any\n         event within two (2) Business Days) of the occurrence of any Change of\n         Control or of any event or circumstance that would reasonably be\n         expected to result in a Change of Control.\n\n    (d)  Any repayment required under this Section 2.06 shall be accompanied by\n--------------------------------------------------------------------------------\nARTICLE VII - NEGATIVE COVENANTS (SELECTED PROVISIONS)\n--------------------------------------------------------------------------------\n\nSECTION 7.01  Indebtedness. The Borrower shall not, and shall not permit any\nsubsidiary to, create, incur or assume any Indebtedness, except for Permitted\nIndebtedness.\n\nSECTION 7.02  Liens. The Borrower shall not, and shall not permit any subsidiary\nto, create or permit to exist any Lien on any of its property, except for\nPermitted Liens.\n\nSECTION 7.03  Fundamental Changes. The Borrower shall not, and shall not permit\nany subsidiary to, merge, consolidate, liquidate, dissolve or enter into any\ntransaction that results in a Change of Control, except as permitted under the\nLoan Documents.\n\nSECTION 7.04  Financial Covenants. The Borrower shall maintain, as of the last\nday of each fiscal quarter:\n\n    (a)  a maximum Total Leverage Ratio of 3.50 to 1.00; and\n\n    (b)  a minimum Fixed Charge Coverage Ratio of 1.25 to 1.00.\n\n--------------------------------------------------------------------------------\nARTICLE VIII - EVENTS OF DEFAULT AND REMEDIES\n--------------------------------------------------------------------------------\n\nSECTION 8.01  Events of Default. Each of the following constitutes an Event of\nDefault:\n\n    (a)  the Borrower fails to pay any principal of any Loan when due, or fails\n         to pay any interest, fee or other amount within three (3) Business Days\n         after the same becomes due;\n\n    (b)  the Borrower fails to perform or observe any covenant contained in\n         Article VII (other than as a result of a Change of Control permitted by\n         the Lender);\n\n    (c)  any representation or warranty made by any Loan Party proves to have\n         been incorrect in any material respect when made;\n\n    (d)  the occurrence of a Change of Control, subject to the Borrower's\n         repayment obligations under Section 2.06; or\n\n    (e)  the Borrower or any subsidiary becomes subject to any bankruptcy,\n         insolvency or similar proceeding.\n\nSECTION 8.02  Remedies. Upon the occurrence and during the continuance of an\nEvent of Default, the Lender may, among other things, declare all Obligations\nimmediately due and payable, terminate its commitments, and exercise all rights\nand remedies available under the Loan Documents and applicable law.\n\n--------------------------------------------------------------------------------\nARTICLE IX - MISCELLANEOUS\n--------------------------------------------------------------------------------\n\nSECTION 9.01  Governing Law. This Agreement is governed by, and construed in\naccordance with, the laws of the State of Utah.\n\nSECTION 9.02  Security. The Obligations are secured by a first-priority security\ninterest in substantially all of the Borrower's and the Guarantors' personal\nproperty, including accounts receivable, inventory, equipment and general\nintangibles, and by a deed of trust on the Borrower's owned real property in\nGrand Junction, Colorado.\n\n--------------------------------------------------------------------------------\nSCHEDULE 1 - OUTSTANDING OBLIGATIONS (as of December 31, 2024)\n--------------------------------------------------------------------------------\n\n    Facility                          Outstanding Principal\n    ------------------------------    ---------------------\n    Revolving Loans                   $ 12,400,000\n    Term Loan                         $ 26,300,000\n    ------------------------------    ---------------------\n    Total Outstanding                 $ 38,700,000\n\n    Accrued and unpaid interest is in addition to the amounts shown above.\n\n[End of excerpts.]\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "retenue", "decision_reason": "Source de travail retenue sous réserve de l’original complet signé", "parent": null, "consulted": true, "signature": "non vérifiée"}, {"id": "P-fee71497bb8d", "path": "employment-benefits-and-change-of-control.txt", "sha256": "39921c487214596cd9577fa169399542d633a4a8f4bbcf55d7121acb8c1e6d09", "units": ["================================================================================\n     EMPLOYMENT, EMPLOYEE BENEFITS, LABOR AND CHANGE-OF-CONTROL SCHEDULE\n     Rocky Environmental Services, Inc. (\"RES\")\n     Prepared for Project Ridgeline diligence\n     Date: January 8, 2025\n================================================================================\n\nThis schedule summarizes certain employment, employee benefits, labor relations\nand executive compensation matters relating to Rocky Environmental Services,\nInc. and its subsidiaries. Copies of the underlying plans, agreements and\nnotices are included in the data room under the \"Employment\" tab.\n\n--------------------------------------------------------------------------------\n1. WORKFORCE SUMMARY\n--------------------------------------------------------------------------------\n\n    -  Total employees: approximately 410\n    -  Field technicians and operators: approximately 300\n    -  Administrative and support: approximately 60\n    -  Management and supervisory: approximately 50\n    -  States of employment: Utah, Colorado, Wyoming, Idaho, Nevada, Montana\n\nThe Company's workforce is non-union as of the date hereof, subject to the\npending representation petition described in Section 5.\n\n--------------------------------------------------------------------------------\n2. EXECUTIVE EMPLOYMENT AND RETENTION\n--------------------------------------------------------------------------------\n\nThe Company has entered into employment agreements with each of its executive\nofficers. Each executive employment agreement contains customary terms regarding\nbase salary, bonus, benefits, confidentiality, non-competition, non-solicitation\nand severance. Certain agreements provide for enhanced payments upon a\ntermination of employment in connection with a change of control, described in\nSection 6.\n\n--------------------------------------------------------------------------------\n3. EMPLOYEE BENEFITS\n--------------------------------------------------------------------------------\n\nThe Company sponsors the following employee benefit plans:\n\n    (a)  a safe harbor 401(k) retirement plan (the \"401(k) Plan\");\n\n    (b)  group health, dental and vision plans;\n\n    (c)  group life and AD&D insurance;\n\n    (d)  short-term and long-term disability plans;\n\n    (e)  flexible spending and health savings accounts; and\n\n    (f)  other customary fringe benefits.\n\n--------------------------------------------------------------------------------\n4. 401(K) PLAN\n--------------------------------------------------------------------------------\n\n    4.1  Plan name:           Rocky Environmental Services, Inc. 401(k) Plan\n    4.2  Plan type:           Safe harbor 401(k) plan (matched)\n    4.3  Plan Year:           Calendar year (January 1 - December 31)\n    4.4  Safe harbor match:   The Plan provides a safe harbor matching\n                              contribution under the basic matching formula.\n    4.5  Safe harbor notice:  A safe harbor notice is provided to eligible\n                              employees within the applicable period prior to\n                              the beginning of each Plan Year.\n    4.6  Suspension of match: Employer matching contributions under the Plan were\n                              suspended for the period from January 2023 through\n                              June 2023. The suspension was communicated to\n                              participants and reflected administratively in\n                              payroll and plan records. Employer matching\n                              contributions resumed in July 2023.\n\n    4.7  Administrative Note: The Plan documents and administrator records are\n         provided in the data room. The Company has not obtained a\n         determination letter specifically addressing the mid-year suspension of\n         safe harbor matching contributions, and the Company is reviewing the\n--------------------------------------------------------------------------------\n5. LABOR RELATIONS - PENDING REPRESENTATION PETITION\n--------------------------------------------------------------------------------\n\n    5.1  On November 4, 2024, a representation (election) petition was filed\n         with the National Labor Relations Board (\"NLRB\") seeking to represent a\n         unit of the Company's field technicians.\n\n    5.2  Petition details (as filed):\n         -  Filing date:             November 4, 2024\n         -  Affected employees:      62 field technicians\n         -  Locations:               Grand Junction, Colorado and Casper, Wyoming\n         -  Petitioner:              A labor organization\n         -  Proposed unit:           Field technicians at the specified\n                                     locations\n         -  Status:                  Petition pending; the regional office is\n                                     processing the petition, including any\n                                     issues relating to the appropriate unit and\n                                     eligibility.\n\n    5.3  The Company is participating in the NLRB process in the ordinary course\n         and is providing information requested by the regional office. The\n         Company's response to the organizing effort is being handled in\n         accordance with applicable law. The outcome of the petition process is\n         not yet determined, and no collective bargaining agreement is currently\n         in place with respect to the affected employees.\n\n    5.4  The Company's workforce was non-union prior to the filing of the\n         petition.\n\n--------------------------------------------------------------------------------\n6. EXECUTIVE CHANGE-OF-CONTROL SEVERANCE\n--------------------------------------------------------------------------------\n\n    6.1  Each of the Company's executive officers is party to an employment\n         agreement or change-of-control agreement providing for severance and\n         related payments upon certain qualifying terminations of employment in\n         connection with, or within a specified period following, a change of\n         control of the Company. The Transaction, if consummated, would\n         constitute a change of control for purposes of these agreements, and\n         the payments below are or may become payable to the affected executives\n         in connection with the Transaction.\n\n    6.2  The potential payments to the Company's executive officers are\n         summarized below:\n\n         Officer                      Title                 Potential Payment\n         ---------------------------  --------------------  -----------------\n         Douglas R. Kessler           CEO                   $1,312,500\n         Margaret L. Ortega           COO                   $1,312,500\n         Anthony R. Boyle             CFO                   $  425,000\n         Cynthia M. Reyes             VP Operations         $  375,000\n         Grant T. Whitmore            VP Business           $  350,000\n                                      Development\n         ---------------------------  --------------------  -----------------\n         Total                                              $3,775,000\n\n    6.3  The payments above represent the aggregate potential amounts payable to\n         the five executives, including severance, bonus and related amounts, in\n         each case in connection with the Transaction or a qualifying\n         termination of employment related thereto, as applicable. The actual\n         amounts payable will depend on the terms of the applicable agreements\n         and whether the specified triggering events occur.\n\n    6.4  The Company has not determined how the amounts described in this\n         Section will be characterized for purposes of the Transaction.\n\n--------------------------------------------------------------------------------\n7. OTHER EMPLOYMENT MATTERS\n--------------------------------------------------------------------------------\n\n    7.1  The Company is not aware of any material employment litigation,\n         discrimination claims, wage-and-hour claims or governmental employment\n         investigations, other than routine matters arising in the ordinary\n         course.\n\n    7.2  The Company maintains workers' compensation insurance as described in\n         the insurance program summary.\n\n    7.3  Certain employees are party to confidentiality, non-competition and\n         non-solicitation agreements, and the Company's personnel are subject to\n         confidentiality obligations relating to the Company's proprietary\n         information and systems.\n\n[End of Employment, Benefits, Labor and Change-of-Control Schedule.]\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "à examiner", "decision_reason": "", "parent": null, "consulted": false, "signature": "non vérifiée"}, {"id": "P-92c0fae4f1e3", "path": "environmental-permits-and-compliance.txt", "sha256": "7809354b882c4bf6e6974ba2c8b747567e5b0753e93dd1127bfff885624b7e4a", "units": ["================================================================================\n              ENVIRONMENTAL PERMITS AND COMPLIANCE SCHEDULE\n              Rocky Environmental Services, Inc. (\"RES\")\n              Prepared for Project Ridgeline diligence\n              Date: January 8, 2025\n================================================================================\n\nThis schedule identifies material environmental permits, approvals and related\ncompliance items for the facilities and operations of Rocky Environmental\nServices, Inc. and its subsidiaries. Permit references and agency tracking\nnumbers are provided where available. Copies of issued permits are included in\nthe data room under the \"Environmental\" tab.\n\n--------------------------------------------------------------------------------\n1. HAZARDOUS WASTE PERMITS\n--------------------------------------------------------------------------------\n\n1.1  Utah - Salt Lake City Transfer Station\n     Permit No.:            UTH-0441\n     Facility:              Salt Lake City Transfer Station\n                            2100 West North Temple, Salt Lake City, UT 84116\n     Permit Holder:         Pinnacle Waste Solutions, LLC\n     Issuing Agency:        Utah Department of Environmental Quality (UDEQ),\n                            Division of Waste Management and Radiation Control\n     Regulatory Basis:      Utah Administrative Code R315-3 (Hazardous Waste\n                            Management), including R315-3-3 through R315-3-5\n                            (permit requirements and permit modifications), and\n                            applicable provisions of 40 C.F.R. Part 270 as\n                            incorporated by reference.\n     Permit Type:           Hazardous waste transfer/storage facility permit\n     Issued:                February 14, 2019\n     Expiration:            February 13, 2029\n     Status:                Active. Records reflect that the permit currently\n                            remains in the name of Pinnacle Waste Solutions,\n                            LLC. No final, formally issued permit transfer or\n                            reissuance to Rocky Environmental Services, Inc. has\n                            been located in the Company's files or in agency\n                            records reviewed to date.\n\n     Note: RES acquired Pinnacle Waste Solutions, LLC in March 2022. The Salt\n     Lake City transfer station has been operated under the existing permit by\n     personnel of the RES group since that time. The Company's environmental\n     staff report that agency correspondence and periodic compliance submittals\n     have been made under the existing permit number. The Company's files do not\n     contain a final permit modification or transfer reflecting RES as the\n     permit holder.\n\n     Under R315-3 and applicable permitting practice, a change in the ownership\n     or operational control of a permitted hazardous waste facility is generally\n     addressed through permit modification procedures, and the manner in which\n     such changes are documented can vary. The Company has not requested\n     confirmatory written guidance from the agency regarding the current\n     registration of this permit.\n\n1.2  Wyoming - Casper Facility\n     Permit No.:            WY-HW-2019-033\n     Facility:              Casper Field Services / Storage Yard\n                            1350 Bryan Stock Trail, Casper, WY 82601\n     Permit Holder:         Rocky Environmental Services, Inc.\n     Issuing Agency:        Wyoming Department of Environmental Quality (WDEQ),\n                            Solid and Hazardous Waste Division\n     Regulatory Basis:      Wyoming Hazardous Waste Rules, Chapter 3; 40 C.F.R.\n                            Parts 260-270 as incorporated.\n     Issued:                December 1, 2019\n     Expiration:            November 30, 2024\n     Renewal Application:   Timely filed October 15, 2024 (i.e., on or before\n                            the expiration date and within any applicable\n                            filing window). Under the agency's timely-renewal\n                            practice and applicable continuation rules, the\n                            permit continues in effect, and the facility may\n                            continue authorized operations, while the renewal\n                            application is pending agency processing.\n     Status:                Renewal pending; operations continuing under the\n                            timely-filed renewal application.\n\n--------------------------------------------------------------------------------\n2. AIR PERMITS\n--------------------------------------------------------------------------------\n\n2.1  Utah - Salt Lake City Transfer Station\n     Permit No.:            UTH-AIR-0712\n     Permit Holder:         Pinnacle Waste Solutions, LLC\n     Description:           Minor source permit for miscellaneous emissions\n                            associated with transfer operations.\n     Expiration:            June 30, 2027\n     Status:                Active.\n\n2.2  Colorado - Grand Junction Industrial Yard\n     Permit No.:            CO-GJ-AP-2210\n     Permit Holder:         Rocky Environmental Services, Inc.\n     Description:           Permit for shop operations and associated emissions.\n--------------------------------------------------------------------------------\n3. STORMWATER AND WATER PERMITS\n--------------------------------------------------------------------------------\n\n3.1  Multi-Sector General Permit (MSGP) / State Equivalents\n     The Company maintains industrial stormwater coverage for its yard and\n     transfer facilities in Utah, Colorado, Wyoming, Idaho, Nevada and Montana,\n     including coverage under the U.S. EPA Multi-Sector General Permit for\n     Stormwater Discharges Associated with Industrial Activity and applicable\n     state-issued general permits. Stormwater Pollution Prevention Plans (SWPPPs)\n     are maintained for each covered facility.\n\n3.2  Utah - Salt Lake City Transfer Station\n     Stormwater Coverage:   Utah MSGP (state-issued general permit)\n     Reference:             UTR-Coverage-XXXX (transfer station sector)\n     Status:                Active.\n\n--------------------------------------------------------------------------------\n4. TRANSPORTATION AND WASTE HANDLING AUTHORIZATIONS\n--------------------------------------------------------------------------------\n\n4.1  The Company maintains hazardous and non-hazardous waste transporter\n     registrations and USDOT registrations for its fleet to operate in the\n     states in which it provides transportation services, including Utah,\n     Colorado, Wyoming, Idaho, Nevada and Montana.\n\n4.2  The Company maintains a valid EPA Identification (EPA ID) Number for each\n     facility that generates, transports, treats, stores or disposes of\n     hazardous waste, and utilizes authorized treatment, storage and disposal\n     facilities (TSDFs) for off-site disposal.\n\n--------------------------------------------------------------------------------\n5. COMPLIANCE HISTORY AND NOTES\n--------------------------------------------------------------------------------\n\n5.1  General. The Company's EHS department maintains a compliance calendar,\n     conducts periodic facility audits, provides employee training, and tracks\n     regulatory inspections and correspondence. The Company believes its\n     operations are conducted in substantial compliance with applicable\n     environmental requirements.\n\n5.2  Agency correspondence. From time to time, the Company receives inspection\n     reports, information requests and notices from environmental agencies in\n     the ordinary course. Certain regulatory matters are separately summarized in\n     the litigation and regulatory matters schedule included in the data room.\n\n5.3  Salt Lake City transfer station. Agency correspondence relating to the\n     transfer station during the period since the Pinnacle acquisition has been\n     addressed under permit number UTH-0441. The Company is reviewing the\n     documentation of the permit holder of record in connection with the\n     Transaction.\n\n5.4  Wyoming Casper facility. The pending renewal of permit WY-HW-2019-033 is\n     being handled in the ordinary course. The Company is not aware of any\n     compliance issue affecting the facility's ability to continue operations\n     during the renewal process.\n\n5.5  Remediation accrual. The Company maintains an environmental remediation\n     accrual of approximately $3,200,000 across all facilities combined, which\n     management believes is adequate for its currently identified obligations.\n\n[End of Environmental Permits and Compliance Schedule.]\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "à examiner", "decision_reason": "", "parent": null, "consulted": false, "signature": "non vérifiée"}, {"id": "P-32d47e46091f", "path": "executed-letter-of-intent.txt", "sha256": "b252e61f397b68ef4f8fadd944b6ac916b1de5d0b3fdc5c7610b807614aad506", "units": ["================================================================================\n                    EXECUTED LETTER OF INTENT\n================================================================================\n\n                            PROJECT RIDGELINE\n\n                        December 19, 2024\n\nRocky Environmental Services, Inc.\n3480 South Commerce Way, Suite 200\nSalt Lake City, Utah 84104\n\nAttention: Douglas R. Kessler, Chief Executive Officer\n\nRe:  Non-Binding Letter of Intent to Acquire Certain Equity Interests of\n     Rocky Environmental Services, Inc.\n\nDear Mr. Kessler:\n\nThis letter of intent (this \"Letter\") sets forth the principal terms and\nconditions under which Sycamore Capital Partners (\"Buyer\" or \"Sycamore\"), or an\naffiliate thereof, would acquire (the \"Transaction\") all of the outstanding\nequity interests of Rocky Environmental Services, Inc., a Utah corporation (the\n\"Company\" or \"RES\"), from the holders of such equity interests (each, a\n\"Seller\" and collectively, the \"Sellers\"). This Letter is intended solely as an\nexpression of the parties' present intentions and, except as expressly provided\nin Section 14 hereof, is not intended to be a legally binding obligation of any\nparty.\n\n1.  TRANSACTION STRUCTURE\n\n    1.1  Buyer proposes to acquire 100% of the issued and outstanding equity\n         interests of the Company on a cash-free, debt-free basis, with the\n         purchase price to be delivered at closing in cash, subject to the\n         adjustments, holdback and other terms set forth herein.\n\n    1.2  The Transaction is expected to be effected by way of a merger or equity\n         purchase, the final structure to be determined by Buyer in\n         consultation with its legal and tax advisors following completion of\n         confirmatory diligence.\n\n2.  PURCHASE PRICE\n\n    2.1  Based on the Company's trailing twelve-month (\"TTM\") revenue of\n         approximately $127.1 million and management's reported financial\n         results, Buyer is prepared to pay an indicative enterprise value of\n         between approximately $182 million and $205 million, subject to\n         confirmation of quality of earnings, working capital, indebtedness and\n         other confirmatory diligence.\n\n    2.2  The enterprise value assumes a cash-free, debt-free structure. At\n         closing, the Company will have no cash (other than a mutually agreed\n         minimum operating amount) and no indebtedness, and the purchase price\n         will be subject to adjustment for the actual amount of cash, the\n         amount of indebtedness, and the amount by which closing working\n         capital differs from an agreed target working capital amount.\n\n    3.  HOLDBACK\n\n    3.1  At closing, Buyer will withhold ten percent (10%) of the purchase price\n         (the \"Holdback Amount\") as security for the Sellers' post-closing\n         indemnification obligations under the definitive purchase agreement.\n\n    3.2  Based on the indicative enterprise value range set forth above, the\n         expected Holdback Amount is approximately $18.2 million to $20.5\n         million.\n\n4.  WORKING CAPITAL\n\n    4.1  The Transaction will include a customary working capital mechanism. A\n         target working capital amount will be agreed by the parties prior to\n         execution of the definitive purchase agreement based on a normalized\n         historical average of the Company's accounts receivable, inventory,\n         prepaid expenses, accounts payable and accrued liabilities, in each\n         case determined in accordance with the Company's historical accounting\n         practices.\n\n    4.2  The purchase price will be increased or decreased, as applicable, on a\n         dollar-for-dollar basis to the extent that closing working capital is\n         greater or less than the agreed target amount.\n\n    4.3  \"Net Debt\" means, as of the closing, all outstanding indebtedness for\n         borrowed money of the Company and its subsidiaries, together with\n         accrued and unpaid interest thereon, capital lease obligations,\n         letters of credit drawn and unreimbursed, and any other obligations of\n         the type required to be reflected as indebtedness on a balance sheet\n         prepared in accordance with GAAP.\n\n5.  EXCLUSIVITY\n\n    5.1  From the date of full execution of this Letter until the earlier of\n         (a) execution of the definitive purchase agreement and (b) the date\n         that is sixty (60) days following the date hereof (the \"Exclusivity\n         Period\"), the Sellers and the Company will deal exclusively with Buyer\n         with respect to the Transaction.\n\n    5.2  During the Exclusivity Period, neither the Sellers nor the Company will,\n         directly or indirectly, solicit, initiate, encourage or entertain any\n         inquiry, proposal or offer from any person other than Buyer relating\n         to any acquisition of all or a material portion of the equity or assets\n         of the Company.\n\n    5.3  The Exclusivity Period may be extended by mutual written agreement of\n         the parties.\n\n6.  DILIGENCE\n\n    6.1  Following execution of this Letter, the Company will afford Buyer and\n         its representatives, including its legal counsel Thornfield &\n         Associates LLP and its accounting and environmental advisors,\n         reasonable access to the Company's books, records, contracts,\n         properties, facilities, personnel and other information for the purpose\n         of conducting confirmatory legal, financial, environmental, tax,\n         insurance, labor and regulatory diligence.\n\n    6.2  Buyer's obligation to proceed is expressly conditioned upon the\n         satisfactory completion of such diligence. The Company will make\n         available a virtual data room containing the materials reasonably\n         requested by Buyer.\n\n7.  FINANCING\n\n    7.1  Buyer intends to fund the Transaction through a combination of equity\n         capital from Sycamore Capital Partners and affiliated investment\n         vehicles and debt financing to be arranged with one or more banks or\n         other financial institutions.\n\n    7.2  Buyer's obligations under the definitive purchase agreement will not be\n         conditioned upon obtaining financing.\n\n8.  EMPLOYEE MATTERS\n\n    8.1  Buyer expects to offer employment to substantially all of the Company's\n         employees on terms and conditions, including base compensation and\n         benefits, that are substantially comparable in the aggregate to those\n         provided by the Company immediately prior to closing.\n\n    8.2  The parties will cooperate in good faith to address employee benefit\n         plan integration, continuation of service credit for vesting and\n         eligibility purposes, and any required notices or filings.\n\n    8.3  The Company will continue to operate its employee benefit plans in the\n         ordinary course, consistent with past practice and applicable law,\n         through the closing.\n\n9.  DEFINITIVE AGREEMENT PROCESS\n\n    9.1  The parties will negotiate in good faith with the goal of executing a\n         definitive purchase agreement (including related transaction documents,\n         disclosure schedules, an escrow agreement and such other agreements as\n         are customary for a transaction of this size and type) as promptly as\n         practicable following completion of confirmatory diligence.\n\n    9.2  The definitive purchase agreement will contain customary representations\n         and warranties, covenants, closing conditions and termination\n         provisions.\n\n    9.3  The representations and warranties will be subject to customary\n         survival periods. General representations and warranties will survive\n         the closing for eighteen (18) months. Environmental representations\n         and warranties, and tax representations and warranties, will survive\n         the closing for six (6) years.\n\n10. CONFIDENTIALITY\n\n    10.1 The parties will continue to be bound by the terms of the mutual\n         confidentiality agreement previously executed in connection with the\n         evaluation of the Transaction, which remains in full force and effect.\n\n    10.2 Neither party will disclose the existence or terms of this Letter or the\n         Transaction to any third party, except to its advisors, financing\n         sources, and as required by law, without the prior written consent of\n         the other party.\n\n11. GOVERNING LAW\n\n    11.1 This Letter and the definitive purchase agreement will be governed by,\n         and construed in accordance with, the laws of the State of Utah, without\n         regard to its conflict of laws principles.\n\n12. TRANSACTION EXPENSES\n\n    12.1 Except as otherwise expressly provided, each party will bear its own\n         fees, costs and expenses incurred in connection with the Transaction,\n         including fees, costs and expenses of legal counsel, accountants,\n         brokers, advisors, consultants and other representatives incurred in\n         connection with the negotiation, documentation, financing and\n         consummation of the Transaction (collectively, \"Transaction\n         Expenses\").\n\n    12.2 Certain Transaction Expenses may be treated as a reduction to the\n         purchase price or as a Cash-Free/Debt-Free adjustment, as the parties\n         may agree in the definitive purchase agreement.\n\n13. INDEMNIFICATION\n\n    13.1 The definitive purchase agreement will provide for customary\n         indemnification by the Sellers of Buyer and its affiliates for breaches\n         of representations, warranties and covenants, with the Holdback Amount\n         serving as the first source of recovery.\n\n    13.2 Indemnification will be subject to customary limitations, including\n         deductibles, caps and exclusions, to be mutually agreed.\n\n14. BINDING PROVISIONS\n\n    14.1 Except for the provisions of Sections 5 (Exclusivity), 10\n         (Confidentiality), 11 (Governing Law), 12 (Transaction Expenses) and\n         this Section 14, which are intended to be binding on the parties, this\n         Letter constitutes a statement of intent only and does not create any\n         legally binding obligations on either party.\n\n    14.2 The parties acknowledge that any obligation to consummate the\n         Transaction will arise only upon execution and delivery of a definitive\n         purchase agreement.\n\n--------------------------------------------------------------------------------\n                            SIGNATURE PAGE FOLLOWS\n\n[Signature pages retained in the executed copy.]\n\n--------------------------------------------------------------------------------\nEXECUTED as of the date first written above.\n\nSYCAMORE CAPITAL PARTNERS\n\nBy:  /s/ Marcus Hahn\n     Name:  Marcus Hahn\n     Title: Partner\n\nBy:  /s/ Elaine Whitford\n     Name:  Elaine Whitford\n     Title: Managing Director\n\nROCKY ENVIRONMENTAL SERVICES, INC.\n\nBy:  /s/ Douglas R. Kessler\n     Name:  Douglas R. Kessler\n     Title: Chief Executive Officer\n\nSELLERS\n\nBy:  /s/ Douglas R. Kessler\n     Name:  Douglas R. Kessler, individually and as representative of the Sellers\n\n--------------------------------------------------------------------------------\nEXHIBIT A - INDICATIVE TIMELINE (informational only)\n\n  Week 1-2   : Confirmatory diligence kickoff; data room completion\n  Week 3-6   : Financial, legal and environmental diligence\n  Week 6-8   : Quality of earnings finalization; definitive agreement negotiation\n  Week 9-10  : Execution of definitive purchase agreement\n  Week 11-14 : Regulatory and third-party consents; closing\n\n[End of executed Letter of Intent.]\n\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "à examiner", "decision_reason": "", "parent": null, "consulted": false, "signature": "non vérifiée"}, {"id": "P-648381a126ae", "path": "fleet-capex-and-fixed-assets.csv", "sha256": "26e8c09576c55614acdcdbb8218278b5f77c53f3c35eb8b3ac72363f0ffea3cb", "units": ["Asset_Category,Units,Average_Age_Years,Expected_Useful_Life_Years,Replacement_Cost,Current_Condition,Planned_Capex,Notes\nVacuum Trucks,28,9.5,8,12600000,Fair to Poor,400000,\"Primary revenue fleet; average odometer 342000 mi; increasing hydraulic and vacuum pump repairs; 19 of 28 units beyond target replacement age.\"\nTanker
