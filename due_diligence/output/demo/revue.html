 operational platform; ongoing enhancement and maintenance.\"\nFLEET SUBTOTAL,240,8.2,7,50020000,,\"4300000\",\"Fleet includes 240 vehicles, trailers and pieces of heavy equipment. Weighted average age 8.2 years versus stated 7-year target replacement cycle for over-the-road vehicles; a substantial number of units are operating beyond their normal replacement cycle. Management's estimated normalized maintenance capital expenditures of $4,000,000 to $4,500,000 per year are reflected in Planned_Capex.\"\nFIXED ASSETS (NON-FLEET) SUBTOTAL,6,6.9,10,10550000,,\"870000\",\"Includes owned real property, leasehold improvements, IT/ERP, capitalized RidgeTrack development and office equipment.\"\nTOTAL COMPANY FIXED ASSETS AND FLEET,246,8.1,,60570000,,\"5170000\",\"Total estimated replacement cost of fleet and fixed assets. Planned_Capex reflects management's planned 2025 capital program; Growth_Capex is separate and not included above.\"\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "à examiner", "decision_reason": "", "parent": null, "consulted": false, "signature": "non vérifiée"}, {"id": "P-eb017e41ce28", "path": "insurance-program-summary.txt", "sha256": "9ab5e290b7f039bc9f5ecb76e29aeb4bdbacf0032d29b1488ae2135f25562816", "units": ["================================================================================\n                     INSURANCE PROGRAM SUMMARY\n                     Rocky Environmental Services, Inc. (\"RES\")\n                     Policy Year: 2024-2025\n                     Prepared: January 8, 2025\n================================================================================\n\nThis summary describes the material insurance policies maintained by Rocky\nEnvironmental Services, Inc. and its subsidiaries as of the date hereof.\nCoverage summaries are provided for diligence purposes and do not amend,\nsupersede or replace the terms of the underlying policies. Copies of the\nunderlying policies are included in the data room under the \"Insurance\" tab.\n\n--------------------------------------------------------------------------------\n1. PROGRAM OVERVIEW\n--------------------------------------------------------------------------------\n\n    Line of Coverage            Insurer                    Limit\n    --------------------------  -------------------------  ------------------\n    Commercial General          Granite Peak Insurance     $1,000,000 occ.\n    Liability (CGL)             Company                    $2,000,000 agg.\n    Commercial Auto             Granite Peak Insurance     $1,000,000 CSL\n                                Company\n    Workers' Compensation       State Compensation Fund /  Statutory\n                                Granite Peak Insurance\n    Umbrella / Excess           Cascade National           $25,000,000\n                                Assurance Corp.            (each occ./agg.)\n    Property (All Risk)         Sentinel Mutual            $28,000,000\n                                Insurance\n    Environmental / Pollution   American Environmental     $10,000,000\n    Liability (EIL) /            Indemnity Company          (each loss)\n    Contractors Pollution\n    Directors' & Officers       Lakeside Specialty         $10,000,000\n    (D&O)                       Insurance\n\n--------------------------------------------------------------------------------\n2. COMMERCIAL GENERAL LIABILITY (CGL)\n--------------------------------------------------------------------------------\n\n    Insurer:            Granite Peak Insurance Company\n    Policy No.:         GP-CGL-2024-04417\n    Policy Period:      July 1, 2024 - July 1, 2025\n    Limits:             $1,000,000 each occurrence; $2,000,000 general aggregate;\n                        $2,000,000 products-completed operations aggregate;\n                        $100,000 fire damage; $10,000 medical expense\n    Deductible/SIR:     $25,000 per occurrence\n    Coverage:           Bodily injury and property damage liability arising from\n                        the Company's premises, operations, products and\n                        completed operations. Includes contractors' liability,\n                        explosion, collapse and underground (XCU) coverage\n                        where indicated by endorsement.\n    Exclusions (sel.):  Pollution (limited and as modified by endorsement);\n                        professional services; auto; workers' compensation.\n\n--------------------------------------------------------------------------------\n3. COMMERCIAL AUTO\n--------------------------------------------------------------------------------\n\n    Insurer:            Granite Peak Insurance Company\n    Policy No.:         GP-AUTO-2024-04418\n    Policy Period:      July 1, 2024 - July 1, 2025\n    Limits:             $1,000,000 combined single limit (owned, hired,\n                        non-owned); $5,000 medical payments\n    Deductible:         $10,000 comprehensive / $25,000 collision\n    Coverage:           Liability and physical damage for the Company's owned,\n                        hired and non-owned vehicles and trailers.\n\n--------------------------------------------------------------------------------\n4. WORKERS' COMPENSATION\n--------------------------------------------------------------------------------\n\n    Insurer:            Granite Peak Insurance Company / State Compensation Fund\n    Policy No.:         GP-WC-2024-04419\n    Policy Period:      July 1, 2024 - July 1, 2025\n    Limits:             Statutory (Part One); $1,000,000 employer's liability\n                        (Parts Two and Three)\n    Coverage:           Statutory workers' compensation and employer's liability\n                        coverage for employees in all states of operation.\n\n--------------------------------------------------------------------------------\n5. UMBRELLA / EXCESS LIABILITY\n--------------------------------------------------------------------------------\n\n    Insurer:            Cascade National Assurance Corp.\n    Policy No.:         CNA-UX-2024-11902\n    Policy Period:      July 1, 2024 - July 1, 2025\n    Limits:             $25,000,000 each occurrence / annual aggregate in excess\n                        of the scheduled underlying policies\n    Underlying:         CGL, Commercial Auto, Employer's Liability\n    Exclusions (sel.):  Follows form to underlying with respect to pollution;\n                        further subject to the absolute pollution exclusion and\n                        any buy-back provided by the underlying EIL policy.\n\n--------------------------------------------------------------------------------\n6. PROPERTY (ALL RISK)\n--------------------------------------------------------------------------------\n\n    Insurer:            Sentinel Mutual Insurance\n    Policy No.:         SM-PROP-2024-77321\n    Policy Period:      July 1, 2024 - July 1, 2025\n    Limits:             $28,000,000 blanket; including real and personal\n                        property, equipment floater and business interruption\n    Deductible:         $50,000 (property); 72-hour waiting period (BI)\n    Coverage:           All-risk property coverage for owned and leased\n                        buildings, contents, and scheduled vehicles and\n--------------------------------------------------------------------------------\n7. ENVIRONMENTAL / POLLUTION LIABILITY (EIL / CONTRACTORS POLLUTION)\n--------------------------------------------------------------------------------\n\n    Insurer:            American Environmental Indemnity Company\n    Policy No.:         AEI-EIL-2024-44012\n    Policy Period:      July 1, 2024 - July 1, 2025\n    Coverage Form:      Combined Environmental Impairment Liability and\n                        Contractors Pollution Liability\n    Limits:             $10,000,000 each loss; $10,000,000 policy aggregate\n    Self-Insured        $100,000 each loss (claims-made basis)\n    Retention:\n    Coverage:           Third-party liability for bodily injury, property\n                        damage and environmental remediation costs arising from\n                        pollution conditions caused by the insured, including\n                        sudden and accidental releases and certain gradual\n                        conditions as expressly provided by the policy.\n    Claims Basis:       Claims-made and reported.\n\n    Key Exclusions and Limitations (summarized):\n\n        (a)  Known Conditions. The policy does not provide coverage for any\n             pollution condition, contamination, release or threatened release\n             that was known to any insured prior to the policy inception date,\n             or that is described in any notice, report or other document\n             furnished to the insurer.\n\n        (b)  Gradual Contamination at Owned Facilities. The policy excludes\n             coverage for, and does not insure any liability, loss, cost or\n             expense arising out of or in connection with, any gradual\n             contamination, gradual pollution, gradual release or gradual\n             seepage, migration or discharge of pollutants, contaminants or\n             hazardous substances at or from any location or facility that is\n             owned, leased or operated by any insured. For the avoidance of\n             doubt, coverage is not provided for remediation of, or liability\n             arising from, pre-existing or gradual contamination originating at\n             owned locations, including contamination attributable to historical\n             operations. Coverage under this policy is limited to pollution\n             conditions arising from the insured's operations that are not\n             otherwise excluded, as further set forth in the policy.\n\n        (c)  Prior Acts / Retroactive Date. Coverage applies only to pollution\n             conditions that commence on or after the retroactive date of\n             July 1, 2019, subject to the terms of the policy.\n\n        (d)  Other standard exclusions, including contractual liability\n             assumed, fines and penalties (except defense costs where covered),\n             and asbestos.\n\n--------------------------------------------------------------------------------\n8. DIRECTORS' AND OFFICERS' LIABILITY (D&O)\n--------------------------------------------------------------------------------\n\n    Insurer:            Lakeside Specialty Insurance\n    Policy No.:         LSI-DO-2024-88130\n    Policy Period:      July 1, 2024 - July 1, 2025\n    Limits:             $10,000,000 (Side A/B/C)\n    Retention:          $250,000 (company reimbursement / entity cover); $0\n                        Side A\n    Coverage:           Management liability coverage for the Company's\n                        directors and officers and entity securities claims.\n    Notes:              The policy contains change-of-control provisions\n                        customary for a transaction of this type. Coverage for\n                        wrongful acts occurring prior to a change of control\n                        continues for the applicable run-off period as provided\n                        in the policy.\n\n--------------------------------------------------------------------------------\n9. GENERAL NOTES\n--------------------------------------------------------------------------------\n\n    9.1  All policies are subject to their terms, conditions, exclusions,\n         limitations, deductibles and retentions. This summary is qualified in\n         its entirety by the underlying policies.\n\n    9.2  The Company maintains limits that management believes are customary and\n         adequate for a business of its size and risk profile.\n\n    9.3  Notice. The Company has provided notice of claims and circumstances to\n         applicable insurers in the ordinary course where it has determined that\n         notice is appropriate under the policies.\n\n[End of Insurance Program Summary.]\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "à examiner", "decision_reason": "", "parent": null, "consulted": false, "signature": "non vérifiée"}, {"id": "P-a8639a5e77d5", "path": "leases-and-real-estate-summary.txt", "sha256": "699e23e3bd6ecf3d9b5ae177fefdbda0348deab62ee7a5e26051b430d16abce3", "units": ["================================================================================\n                 LEASES AND REAL ESTATE SUMMARY\n                 Rocky Environmental Services, Inc. (\"RES\")\n                 Prepared for Project Ridgeline diligence\n                 Date: January 8, 2025\n================================================================================\n\nThis schedule summarizes the owned and leased real property used by Rocky\nEnvironmental Services, Inc. and its subsidiaries as of the date hereof. Where\navailable, lease document references and recorded instruments are identified.\nCopies of the referenced documents are included in the data room under the\n\"Real Estate\" tab.\n\n--------------------------------------------------------------------------------\n1. PORTFOLIO SUMMARY\n--------------------------------------------------------------------------------\n\n    #   Facility / Use                     City, State        Tenure\n    --  ---------------------------------  -----------------  ----------\n    1   Corporate HQ & Field Operations    Salt Lake City, UT Leased\n    2   Salt Lake City Transfer Station    Salt Lake City, UT Leased\n    3   Grand Junction Industrial Yard     Grand Junction, CO Owned\n    4   Casper Field Services              Casper, WY         Leased\n    5   Idaho Falls Field Office           Idaho Falls, ID    Leased\n    6   Elko Field Office                  Elko, NV           Leased\n    7   Rifle Equipment Yard               Rifle, CO          Leased\n    8   Billings Field Office              Billings, MT       Leased\n\n--------------------------------------------------------------------------------\n2. OWNED PROPERTY\n--------------------------------------------------------------------------------\n\n2.1  Grand Junction Industrial Yard\n     Address:        4820 Highway 6 & 50, Grand Junction, Colorado 81505\n     Parcel:         Mesa County APN 2701-XXX-XX-XXX\n     Size:           Approximately 9.5 acres; shop (approx. 22,000 sq. ft.),\n                     maintenance building (approx. 8,500 sq. ft.) and paved yard\n     Acquired:       December 2009 (purchased; subsequently improved)\n     Encumbrance:    Deed of trust in favor of High Plains Bank, N.A. securing\n                     the Credit Agreement dated January 17, 2023.\n\n     Valuation. Based on an appraisal prepared by High Country Valuation Group,\n     LLC dated November 30, 2022, the Grand Junction property was appraised at a\n     market value of $6,800,000. The appraisal was prepared for financing\n     purposes. Management is not aware of any material change in the physical\n     condition or use of the property since the date of the appraisal.\n\n     Environmental. The property has historically been used for equipment\n     storage, maintenance and field-service staging. Environmental matters\n     relating to this property are addressed in the environmental permit and\n     compliance schedule and in the Phase II environmental site assessment\n     executive summary included in the data room.\n\n--------------------------------------------------------------------------------\n3. LEASED PROPERTIES\n--------------------------------------------------------------------------------\n\n3.1  Corporate HQ & Field Operations\n     Address:        3480 South Commerce Way, Suite 200, Salt Lake City, UT 84104\n     Landlord:       Commerce Way Associates, LLC\n     Lease Date:     April 1, 2019\n     Term:           April 1, 2019 - March 31, 2029 (10 years)\n     Base Rent:      $22.50 / sq. ft. / yr. (approx. 34,000 sq. ft.)\n     Notes:          Standard commercial lease with one (1) five-year renewal\n                     option. Contains customary assignment and subletting\n                     provisions requiring landlord consent (not to be\n                     unreasonably withheld).\n\n3.2  Salt Lake City Transfer Station (2100 West North Temple)\n     Address:        2100 West North Temple, Salt Lake City, UT 84116\n     Landlord:       Wasatch Industrial Properties, LLC\n     Lease Date:     June 1, 2018\n     Original Tenant: Pinnacle Waste Solutions, LLC\n     Term:           June 1, 2018 - May 31, 2028 (10 years, with one (1)\n                     five-year renewal option)\n     Base Rent:      $18.75 / sq. ft. / yr. (approx. 18,500 sq. ft. of building;\n                     paved transfer yard approximately 2.2 acres)\n     Notes:          See Section 4 below.\n\n3.3  Casper Field Services\n     Address:        1350 Bryan Stock Trail, Casper, WY 82601\n     Landlord:       Casper Business Park, LLC\n     Lease Date:     September 1, 2020\n     Term:           September 1, 2020 - August 31, 2025\n     Base Rent:      $12,400 / month\n\n3.4  Idaho Falls Field Office\n     Address:        2945 East Lincoln Road, Idaho Falls, ID 83401\n     Landlord:       Snake River Industrial, LLC\n     Lease Date:     March 15, 2021\n     Term:           Month-to-month following initial one-year term\n     Base Rent:      $6,200 / month\n\n3.5  Elko Field Office\n     Address:        3920 Idaho Street, Elko, NV 89801\n     Landlord:       Ruby Mountain Holdings, LLC\n     Lease Date:     July 1, 2021\n     Term:           July 1, 2021 - June 30, 2026\n     Base Rent:      $7,800 / month\n\n3.6  Rifle Equipment Yard\n     Address:        0150 County Road 346, Rifle, CO 81650\n     Landlord:       Garfield County Properties, LLC\n     Lease Date:     May 1, 2019\n     Term:           May 1, 2019 - April 30, 2029\n     Base Rent:      $9,500 / month\n\n3.7  Billings Field Office\n     Address:        5300 Midland Road, Billings, MT 59101\n     Landlord:       Yellowstone Commercial, LLC\n     Lease Date:     October 1, 2022\n     Term:           October 1, 2022 - September 30, 2027\n--------------------------------------------------------------------------------\n4. SALT LAKE CITY TRANSFER STATION - ASSIGNMENT AND CHANGE OF CONTROL\n--------------------------------------------------------------------------------\n\n4.1  The lease for the Salt Lake City transfer station located at 2100 West\n     North Temple was originally executed on June 1, 2018 by Wasatch Industrial\n     Properties, LLC, as Landlord, and Pinnacle Waste Solutions, LLC, as Tenant.\n     RES acquired Pinnacle Waste Solutions, LLC in March 2022. The transfer\n     station has been occupied and used for transfer operations by personnel of\n     the RES group since the acquisition.\n\n4.2  A complete historical lease file for the Salt Lake City transfer station\n     has not been located. The Company's files contain the original 2018 lease\n     and amendments through 2021, together with rent invoices addressed to\n     \"Pinnacle Waste Solutions, LLC.\" No assignment, novation or other\n     instrument transferring the tenant's interest in the lease to Rocky\n     Environmental Services, Inc., and no written consent of the Landlord to\n     such a transfer, has been located.\n\n4.3  The lease contains the following provision (summarized):\n\n        \"Assignment and Subletting; Change of Control. Tenant shall not\n        assign this Lease or sublet all or any part of the Premises, and\n        shall not permit any transfer of a controlling interest in Tenant\n        (whether by sale of equity, merger, consolidation or otherwise),\n        in each case without the prior written consent of Landlord. Any\n        assignment, sublease or transfer of control effected without such\n        consent shall, at Landlord's option, constitute a default under\n        this Lease. For purposes of this Section, a transfer of a\n        controlling interest in Tenant includes any direct or indirect\n        change in the ownership or control of Tenant, including by\n        operation of a sale of all or substantially all of Tenant's\n        equity or assets or of any parent entity.\"\n\n4.4  Management has not obtained the Landlord's consent to any assignment of the\n     lease or to the acquisition of Pinnacle Waste Solutions, LLC. Counsel is\n     reviewing whether consent is required in connection with the Transaction.\n     The Landlord has continued to accept rent and has not raised the\n     assignment issue with the Company to date.\n\n--------------------------------------------------------------------------------\n5. OTHER REAL ESTATE NOTES\n--------------------------------------------------------------------------------\n\n5.1  No real property other than the Grand Junction Industrial Yard is owned by\n     RES or its subsidiaries. No title insurance policies or ALTA surveys have\n     been located for any leased property.\n\n5.2  The Grand Junction property secures the obligations of RES under the\n     Credit Agreement with High Plains Bank, N.A. A release of the deed of trust\n     will be required at or prior to closing in connection with the repayment of\n     the Obligations.\n\n5.3  Certain leased locations (Idaho Falls) are occupied on a month-to-month\n     basis following expiration of the initial term.\n\n[End of Real Estate Summary.]\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "à examiner", "decision_reason": "", "parent": null, "consulted": false, "signature": "non vérifiée"}, {"id": "P-68b5d3aa8407", "path": "litigation-and-regulatory-matters.txt", "sha256": "7f8661c35afe7944f4d2f8bb9f86ae790fb65f759ae182f784bc7468cef5a3e4", "units": ["================================================================================\n              LITIGATION AND REGULATORY MATTERS SCHEDULE\n              Rocky Environmental Services, Inc. (\"RES\")\n              Prepared for Project Ridgeline diligence\n              Date: January 8, 2025\n================================================================================\n\nThis schedule summarizes litigation, arbitration, governmental investigations and\nregulatory matters involving Rocky Environmental Services, Inc. and its\nsubsidiaries. The descriptions below are based on information provided by the\nCompany and its outside counsel as of the date hereof. The Company's assessment\nof each matter is preliminary and subject to change.\n\n--------------------------------------------------------------------------------\n1. CDPHE ENFORCEMENT MATTER\n--------------------------------------------------------------------------------\n\n    1.1  Matter:            Colorado Department of Public Health and Environment\n                            (CDPHE) - Hazardous Waste Enforcement\n\n    1.2  Docket No.:        CDPHE-HW-2024-0093\n\n    1.3  Agency:            Colorado Department of Public Health and Environment,\n                            Hazardous Materials and Waste Management Division\n\n    1.4  Facility:          Grand Junction Industrial Yard, Grand Junction,\n                            Colorado\n\n    1.5  Status:            Notice of enforcement received; discussions with the\n                            agency are ongoing. No final compliance order or\n                            penalty assessment has been issued.\n\n    1.6  Nature:            The matter relates to alleged hazardous waste\n                            management and recordkeeping deficiencies identified\n                            by the agency in connection with the handling,\n                            labeling and documentation of regulated materials at\n                            the Grand Junction facility.\n\n    1.7  Potential penalty. The applicable statutory maximum civil penalty is\n         $37,500 per day of violation. The parties differ in their\n         characterization of the number of days of alleged violation:\n\n           -  The Company's position is that there were 12 violation days,\n              implying an exposure of approximately $450,000 (12 x $37,500).\n\n           -  The CDPHE's position, as most recently communicated, is that there\n              were 31 violation days, implying an exposure of approximately\n              $1,162,500 (31 x $37,500).\n\n    1.8  Reserve. Management has not recorded a specific balance-sheet reserve\n         for the penalties asserted by CDPHE in this matter.\n\n    1.9  No EBITDA adjustment or balance-sheet reserve specifically relating to\n         this matter has been reflected in the Company's financial statements or\n--------------------------------------------------------------------------------\n2. RAMIREZ PERSONAL INJURY LAWSUIT\n--------------------------------------------------------------------------------\n\n    2.1  Case:              Ramirez v. Rocky Environmental Services, Inc.\n\n    2.2  Case No.:          2:24-cv-00187\n\n    2.3  Court:             U.S. District Court for the District of Wyoming\n\n    2.4  Filed:             August 2024\n\n    2.5  Plaintiff:         An individual alleging personal injury\n\n    2.6  Claimed damages:   $4,800,000\n\n    2.7  Nature of claim:   The plaintiff alleges personal injury arising from\n         alleged exposure to contamination in connection with the Company's\n         operations. The complaint asserts claims sounding in negligence and\n         related theories.\n\n    2.8  Company position:  The Company believes it has meritorious defenses,\n         including challenges to the plaintiff's allegations of exposure,\n         causation and the nature and extent of alleged injuries. The Company\n         also asserts that its operations were conducted in accordance with\n         applicable requirements and that coverage may be available under\n         applicable policies. The Company intends to defend the matter\n         vigorously.\n\n    2.9  Status:            Discovery is ongoing. The matter remains unresolved,\n         and no accrual has been recorded other than as may be reflected in the\n         Company's general litigation reserve. The Company's view of this matter\n         may change as the case develops.\n\n--------------------------------------------------------------------------------\n3. ASBESTOS AND HISTORICAL OPERATIONS\n--------------------------------------------------------------------------------\n\n    3.1  RES conducted asbestos abatement activities from 2012 through 2023.\n         That service line was discontinued in 2023.\n\n    3.2  The Company is not currently aware of any material active asbestos\n         litigation. However, the Company's historical asbestos abatement\n         activities, and the potential for exposure claims associated with those\n         historical operations, could result in claims being asserted in the\n         future. The Company maintains records relating to its historical\n         asbestos abatement work.\n\n    3.3  No specific reserve has been recorded with respect to potential future\n         asbestos-related claims.\n\n--------------------------------------------------------------------------------\n4. OTHER MATTERS\n--------------------------------------------------------------------------------\n\n    4.1  From time to time, the Company is involved in routine claims, disputes\n         and administrative matters arising in the ordinary course of business,\n         including customer contract disputes, workers' compensation claims and\n         motor vehicle claims. Management does not believe such matters,\n         individually or in the aggregate, are material.\n\n    4.2  The Company previously settled a historical commercial contract dispute\n         (Rocky Environmental Services, Inc. v. Anvil Fabrication Co.) in 2023.\n         That matter has been fully resolved and is unrelated to the matters\n         described in Section 1 above.\n\n[End of Litigation and Regulatory Matters Schedule.]\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "retenue", "decision_reason": "Source de travail retenue sous réserve de l’original complet signé", "parent": null, "consulted": true, "signature": "non vérifiée"}, {"id": "P-3a78192f9324", "path": "material-customer-contracts.txt", "sha256": "cc54303be275d63c490320a004d97607343dd5fb0ea34119d9382cc7d3c0093d", "units": ["================================================================================\n                  MATERIAL CUSTOMER CONTRACTS - SUMMARY\n                  Rocky Environmental Services, Inc. (\"RES\")\n                  Prepared for Project Ridgeline diligence\n                  Date: January 8, 2025\n================================================================================\n\nThis document summarizes certain material customer contracts of Rocky\nEnvironmental Services, Inc. The summaries below are qualified in their entirety\nby the underlying agreements, copies of which are included in the data room under\nthe \"Customer Contracts\" tab.\n\n--------------------------------------------------------------------------------\n1. U.S. DEPARTMENT OF ENERGY CONTRACT\n--------------------------------------------------------------------------------\n\n    Customer:           U.S. Department of Energy (\"DOE\")\n    Contract No.:       DE-EM-0005523\n    Contract Type:      Indefinite-delivery, indefinite-quantity (IDIQ) with\n                        firm-fixed-price and time-and-materials task orders\n    Award Date:         September 2021\n    Period of Performance: Base period of five (5) years through September 2026,\n                        with options\n    Contract Ceiling:   $45,000,000\n    Ceiling Remaining:  $12,300,000 (as of the date of this summary)\n    TTM Revenue:        $24,400,000\n    % of TTM Revenue:   19.2%\n    Scope:              Environmental remediation, waste management and related\n                        field services supporting government facilities and\n                        remediation sites.\n\n    1.1  General. The Contract incorporates the Federal Acquisition Regulation\n         (FAR) by reference, including applicable clauses relating to the\n         Government's rights and the Contractor's obligations.\n\n    1.2  Assignment. The Contract is subject to the Anti-Assignment Act and\n         FAR Subpart 42.12 (Novation and Change-of-Name Agreements). Under\n         FAR 42.12, when a Contractor's assets are transferred, the transfer\n         may give rise to the need for a novation agreement, and the transferee\n         generally is not entitled to recognition as the successor to the\n         Government contract unless and until a novation agreement is executed\n         with the cognizant contracting officer. FAR 42.12 sets forth the\n         circumstances in which a novation may be requested and the procedures\n         for processing such requests.\n\n    1.3  Successor contractors and government approvals. Consistent with FAR\n         42.12 and applicable clauses, recognition of a successor contractor is\n         subject to the discretion and approval of the contracting officer, and\n         the Government may recognize a successor in interest only through a\n         properly executed novation or change-of-name agreement. The Contract\n         includes customary provisions regarding the Government's rights,\n         termination for convenience, and the contracting officer's authority.\n\n    1.4  Contracting officer rights. The contracting officer retains authority\n         over contract administration, including with respect to any request for\n         recognition of a successor contractor. The Company makes no\n         representation regarding whether, or on what terms, a novation would be\n         granted with respect to any transaction.\n\n    1.5  Assignment/novation in the Transaction. Buyer's counsel has requested\n         additional information regarding the potential application of FAR 42.12\n         to the Transaction. The Company is providing the underlying Contract\n         and related correspondence for Buyer's review. This summary does not\n--------------------------------------------------------------------------------\n2. CONSOLIDATED MINING CORP. MASTER SERVICE AGREEMENT\n--------------------------------------------------------------------------------\n\n    Customer:           Consolidated Mining Corp.\n    Agreement:          Master Service Agreement\n    Contract No.:       CMS-MSA-2019-114\n    Effective Date:     March 1, 2019\n    Term:               Initial term through February 28, 2025, with automatic\n                        one-year renewals unless terminated\n    TTM Revenue:        $14,500,000\n    % of TTM Revenue:   11.4%\n    Scope:              Waste management, industrial cleaning, remediation and\n                        related field services at the customer's mining sites.\n\n    2.1  General. The Master Service Agreement sets forth the framework terms\n         under which the Company provides services pursuant to work orders,\n         task authorizations and purchase orders issued from time to time. The\n         agreement contains customary commercial terms, including scheduling,\n         invoicing and payment, insurance and indemnity, change-order\n         procedures, and health, safety and environmental requirements.\n\n    2.2  Termination for convenience. The customer may terminate the agreement,\n         or any work order issued thereunder, for convenience upon sixty (60)\n         days' prior written notice to the Company. This termination-for-\n         convenience provision is standard for agreements of this type.\n\n    2.3  Termination for cause. Either party may terminate for material breach\n         not cured within a specified cure period, subject to the terms of the\n         agreement.\n\n    2.4  Assignment. The agreement contains customary restrictions on assignment\n         by the Company without the customer's prior written consent, subject to\n         exceptions for assignments to affiliates and successors by operation of\n         law.\n\n    2.5  Renewal. The agreement renews automatically for successive one-year\n         terms unless either party provides notice of non-renewal in accordance\n         with the agreement.\n\n--------------------------------------------------------------------------------\n3. OTHER SIGNIFICANT CUSTOMER RELATIONSHIPS\n--------------------------------------------------------------------------------\n\nThe following additional relationships are included for context; copies of the\nunderlying agreements are included in the data room where available.\n\n    Customer                        Nature of Relationship          Approx. TTM\n    ------------------------------  ------------------------------  -----------\n    Cascade Refining & Energy       MSA / service agreement         $9.8M\n    Intermountain Utilities Co.     MSA / standing offer            $7.6M\n    Granite State Transportation    Service agreement               $5.1M\n    Various federal agencies        Task orders / contracts         (incl. DOE)\n    Various state and local         Service agreements              $4.2M\n    agencies\n\nThe Company's top ten customers collectively represented approximately 67% of\nTTM revenue. The Company believes its customer relationships are generally\nlong-standing, although certain agreements are terminable on short notice or are\nsubject to renewal, expiration or re-competition in the ordinary course.\n\n--------------------------------------------------------------------------------\n4. GENERAL NOTES\n--------------------------------------------------------------------------------\n\n    4.1  The summaries in this document are provided for convenience and are\n         qualified by the underlying agreements.\n\n    4.2  Certain customer agreements contain restrictions on assignment and\n         provisions addressing changes in ownership or control. Buyer is\n         conducting a review of all material customer agreements to identify any\n         required consents or notices in connection with the Transaction.\n\n    4.3  Revenue amounts shown reflect the trailing twelve months ended\n         September 30, 2024, and are consistent with the Company's quality of\n         earnings materials.\n\n[End of Material Customer Contracts Summary.]\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "retenue", "decision_reason": "Source de travail retenue sous réserve de l’original complet signé", "parent": null, "consulted": true, "signature": "non vérifiée"}, {"id": "P-4415d322c5f4", "path": "org-chart-and-equity-structure.txt", "sha256": "dddfff276679624ffbb0f12302157f8eb613e88e6fe7fc3da79300843075dc29", "units": ["================================================================================\n              ORGANIZATIONAL CHART AND EQUITY STRUCTURE\n              Rocky Environmental Services, Inc. (\"RES\")\n              Prepared for Project Ridgeline diligence\n              Date: January 8, 2025\n================================================================================\n\n--------------------------------------------------------------------------------\n1. LEGAL ENTITY ORGANIZATION CHART\n--------------------------------------------------------------------------------\n\n                        Rocky Environmental Services, Inc.\n                          (Utah corporation - Parent)\n                                     |\n        +--------------------+-------+-------+--------------------+\n        |                    |               |                    |\n   Pinnacle Waste      RES Field       Rocky Remediation     RES Transport,\n   Solutions, LLC      Services, LLC   Services, LLC         LLC\n   (Utah LLC)          (Utah LLC)      (Colorado LLC)        (Utah LLC)\n   100%                100%            100%                  100%\n        |                    |               |                    |\n        +--------------------+-------+-------+--------------------+\n                                     |\n                        Rocky Environmental Services\n                        of Wyoming, LLC\n                        (Wyoming LLC - 100%)\n\nAll subsidiaries are wholly owned, directly or indirectly, by Rocky Environmental\nServices, Inc. The Company prepares consolidated financial statements covering\nthe parent and all subsidiaries.\n\n--------------------------------------------------------------------------------\n2. ENTITY DETAILS\n--------------------------------------------------------------------------------\n\n2.1  Rocky Environmental Services, Inc. (Parent)\n     Jurisdiction:       Utah\n     Entity Type:        Corporation\n     Formation:          1994\n     Principal Office:   3480 South Commerce Way, Suite 200, Salt Lake City, UT\n     Ownership:          100% held by the Shareholders identified in Section 4.\n     Role:               Holding company and primary operating company; employs\n                         corporate and field personnel.\n\n2.2  Pinnacle Waste Solutions, LLC\n     Jurisdiction:       Utah\n     Entity Type:        Limited liability company\n     Formation:          2009\n     Acquired by RES:    March 2022\n     Ownership:          100% owned by Rocky Environmental Services, Inc.\n     Registered Agent:   Registered agent service, Salt Lake City, Utah\n     Status:             Legally existing and in good standing. Currently dormant\n                         and substantially inactive; the entity does not\n                         currently conduct independent operations or maintain\n                         separate employees or bank accounts.\n     Notes:              The entity remains legally existing and has not been\n                         dissolved or merged into any other entity.\n\n2.3  RES Field Services, LLC\n     Jurisdiction:       Utah\n     Entity Type:        Limited liability company\n     Ownership:          100% owned by Rocky Environmental Services, Inc.\n     Role:               Field services and labor resources.\n\n2.4  Rocky Remediation Services, LLC\n     Jurisdiction:       Colorado\n     Entity Type:        Limited liability company\n     Ownership:          100% owned by Rocky Environmental Services, Inc.\n     Role:               Remediation and environmental construction services.\n\n2.5  RES Transport, LLC\n     Jurisdiction:       Utah\n     Entity Type:        Limited liability company\n     Ownership:          100% owned by Rocky Environmental Services, Inc.\n     Role:               Transportation and logistics.\n\n2.6  Rocky Environmental Services of Wyoming, LLC\n     Jurisdiction:       Wyoming\n     Entity Type:        Limited liability company\n     Ownership:          100% owned by Rocky Environmental Services, Inc.\n     Role:               Wyoming operations and facilities.\n\n--------------------------------------------------------------------------------\n3. SUBSIDIARY GUARANTORS AND PLEDGES\n--------------------------------------------------------------------------------\n\nEach of the subsidiaries is a guarantor under the Credit Agreement with High\nPlains Bank, N.A., and the equity interests of each subsidiary are pledged to\n--------------------------------------------------------------------------------\n4. EQUITY OWNERSHIP - ROCKY ENVIRONMENTAL SERVICES, INC. (PARENT)\n--------------------------------------------------------------------------------\n\nThe outstanding equity of the parent consists solely of common stock. Ownership\nis as follows:\n\n    Shareholder                          Shares        % Ownership\n    ----------------------------------   -----------   -----------\n    Douglas R. Kessler                   4,900,000        49.0%\n    The Kessler Family Trust (2011)      2,400,000        24.0%\n    Margaret L. Ortega                   1,500,000        15.0%\n    Steven P. Halloran                     700,000         7.0%\n    RES Employee Stock Ownership Trust     500,000         5.0%\n    ----------------------------------   -----------   -----------\n    Total                               10,000,000       100.0%\n\nNo shareholder agreement, voting trust or similar arrangement affecting the\nequity of the parent has been located, other than (i) a buy-sell agreement dated\n2004 among certain shareholders and (ii) the transfer restrictions contained in\nthe Company's organizational documents.\n\n--------------------------------------------------------------------------------\n5. INTELLECTUAL PROPERTY OWNERSHIP\n--------------------------------------------------------------------------------\n\nThe Company's proprietary operational software platform, RidgeTrack, was\ndeveloped internally by Company employees and is owned and used by the Company\nin its operations. No U.S. copyright registration has been obtained with respect\nto RidgeTrack. Ownership of development work product is addressed through the\nCompany's employment arrangements with its personnel.\n\n--------------------------------------------------------------------------------\n6. OTHER OWNERSHIP MATTERS\n--------------------------------------------------------------------------------\n\n    6.1  The Company holds no equity interests in any entity other than the\n         subsidiaries listed above.\n\n    6.2  No subsidiary holds any equity interest in the parent or in any other\n         subsidiary other than as shown above.\n\n    6.3  The Company's interests in joint ventures, if any, are de minimis or\n         none.\n\n--------------------------------------------------------------------------------\n7. OFFICERS AND KEY MANAGEMENT\n--------------------------------------------------------------------------------\n\n    Name                    Title\n    ----------------------  ------------------------------------------\n    Douglas R. Kessler      Chief Executive Officer\n    Margaret L. Ortega      Chief Operating Officer\n    Anthony R. Boyle        Chief Financial Officer\n    Cynthia M. Reyes        Vice President, Operations\n    Grant T. Whitmore       Vice President, Business Development\n\n[End of Organizational Chart and Equity Structure.]\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "à examiner", "decision_reason": "", "parent": null, "consulted": false, "signature": "non vérifiée"}, {"id": "P-4c4eb908828f", "path": "phase-ii-esa-executive-summary.txt", "sha256": "796d8edb585ef56b9df4a9285d59d738356ca65695c9845f024b2b1329b0ca1e", "units": ["================================================================================\n          PHASE II ENVIRONMENTAL SITE ASSESSMENT - EXECUTIVE SUMMARY\n================================================================================\n\n     Site:            Grand Junction Industrial Yard\n                      4820 Highway 6 & 50\n                      Grand Junction, Mesa County, Colorado 81505\n\n     Prepared for:    Rocky Environmental Services, Inc.\n\n     Prepared by:     Frontier Geosciences & Environmental, LLC\n                      1450 Larimer Street, Suite 620, Denver, CO 80202\n\n     Report Date:     June 28, 2019\n\n     Project No.:     19-0417\n\n     Report Title:    Phase II Environmental Site Assessment, Grand Junction\n                      Industrial Yard, Grand Junction, Colorado\n\n--------------------------------------------------------------------------------\n1. INTRODUCTION AND PURPOSE\n--------------------------------------------------------------------------------\n\nFrontier Geosciences & Environmental, LLC (\"Frontier\") was retained by Rocky\nEnvironmental Services, Inc. (\"RES\" or the \"Company\") to conduct a Phase II\nEnvironmental Site Assessment (the \"Phase II ESA\") of the Grand Junction\nIndustrial Yard located at 4820 Highway 6 & 50, Grand Junction, Colorado (the\n\"Site\"). The Phase II ESA was performed to evaluate potential soil and\ngroundwater impacts identified as recognized environmental conditions in the\npreviously completed Phase I Environmental Site Assessment (dated May 2019) and\nto assess the nature and extent of impacted media in areas of historical\nindustrial use at the Site.\n\nThe Site has been used for industrial purposes for several decades, including\nequipment storage, maintenance and staging, fueling, and the handling of\nregulated and non-regulated materials associated with field operations.\n\nThis document is an executive summary of the Phase II ESA report. It is intended\nto be read in conjunction with the full report and its appendices, which are\nincluded in the data room under the \"Environmental\" tab.\n\n--------------------------------------------------------------------------------\n2. SUBSURFACE INVESTIGATION SCOPE\n--------------------------------------------------------------------------------\n\nThe Phase II ESA scope of work included:\n\n    (a)  advancement of soil borings and collection of soil samples at\n         multiple depths across the yard and near historical fueling, storage\n         and maintenance areas;\n\n    (b)  installation of temporary groundwater monitoring points and collection\n         of groundwater samples;\n\n    (c)  laboratory analysis for volatile organic compounds (VOCs), semi-\n         volatile organic compounds (SVOCs), total petroleum hydrocarbons (TPH),\n         polychlorinated biphenyls (PCBs) and select metals, as appropriate to\n         the historical uses identified; and\n\n    (d)  a screening-level comparison of analytical results to applicable\n         Colorado soil and groundwater standards.\n\n--------------------------------------------------------------------------------\n3. FINDINGS\n--------------------------------------------------------------------------------\n\n3.1  Soil. Analytical results indicate the presence of constituents in soil\n     above applicable screening levels in several areas of the Site. Constituents\n     detected in the impacted areas are consistent with historical industrial and\n     maintenance activities conducted at the Site.\n\n3.2  Nature of impacts. The historical laboratory data and site conditions\n     evaluated by Frontier are consistent with contamination resulting from\n     gradual releases associated with long-term historical operations, rather\n     than a discrete, sudden or accidental release event. The observed\n     distribution of constituents in soil is consistent with gradual\n     contamination that has occurred over an extended period.\n\n3.3  Groundwater. Groundwater was encountered beneath the Site at depths\n     evaluated during the assessment. Detected constituents and general\n     groundwater conditions suggest that groundwater beneath portions of the\n     Site may be impacted. Frontier recommended additional groundwater\n     characterization to further delineate conditions.\n\n3.4  Potential migration. Based on the conditions observed, there is the\n     potential for contaminant migration beyond the immediate areas of the\n     detected impacts, including through subsurface soils and, potentially,\n     toward groundwater. The extent of migration was not fully delineated by the\n--------------------------------------------------------------------------------\n4. ESTIMATED REMEDIATION COSTS\n--------------------------------------------------------------------------------\n\nBased on the conditions identified and the remediation assumptions known as of\nJune 2019, Frontier estimated the range of costs to implement a program to\naddress the identified soil conditions at the Site to be approximately\n$1,800,000 to $2,600,000.\n\nThat estimate was based on the information, conditions and assumptions known at\nthe time the Phase II ESA was prepared, including:\n\n    (a)  the nature and extent of contamination identified as of the assessment\n         date;\n\n    (b)  assumptions regarding the potential for contaminant migration and the\n         area of impacted media requiring management;\n\n    (c)  assumed groundwater conditions and the potential scope of any\n         groundwater management activities;\n\n    (d)  assumed excavation, handling, transportation and off-site disposal\n         costs for impacted media, including landfill tipping fees; and\n\n    (e)  then-applicable federal, state and local regulatory requirements and\n         agency expectations.\n\nThe estimate did not reflect, and did not attempt to predict, potential changes\nin conditions, contaminant migration, disposal costs, regulatory requirements\nor remediation approaches that could arise after the date of the assessment.\nNo updated or current remediation cost estimate has been prepared for the Site.\n\n--------------------------------------------------------------------------------\n5. RECOMMENDATIONS\n--------------------------------------------------------------------------------\n\nFrontier recommended that RES (i) perform additional delineation of soil impacts,\n(ii) conduct further groundwater characterization, (iii) evaluate remediation\nalternatives with respect to the identified conditions, and (iv) maintain\nappropriate regulatory coordination. The recommendations were provided for\nplanning purposes.\n\n--------------------------------------------------------------------------------\n6. RELIANCE AND LIMITATIONS\n--------------------------------------------------------------------------------\n\nThis executive summary and the underlying Phase II ESA were prepared for the\nexclusive use and benefit of Rocky Environmental Services, Inc., and are subject\nto the limitations, qualifications and assumptions set forth in the full report.\nNo party other than the Company is entitled to rely on the report without the\nexpress written consent of Frontier and the Company.\n\n     Note: No Phase II Environmental Site Assessment has been performed at the\n     Grand Junction Industrial Yard since the June 2019 assessment. The\n     Company's environmental remediation accrual, which is maintained across\n     all facilities, is described in the environmental permits and compliance\n     schedule and in the quality of earnings response included in the data room.\n\n[End of Phase II Executive Summary.]\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "à examiner", "decision_reason": "", "parent": null, "consulted": false, "signature": "non vérifiée"}, {"id": "P-459218aa6b96", "path": "qoe-data-request-response.csv", "sha256": "b243ebde196af4b7741bb938db49b4b36112e2d6fbacf224e5127b43d76da17a", "units": ["Request_ID,Category,Question,Seller_Response,Amount_USD,Supporting_Note\nFIN-001,Financial Statements,\"Provide audited or reviewed financial statements for FY2021, FY2022, FY2023 and interim periods for the trailing twelve months ended September 30, 2024.\",\"Reviewed financial statements are provided for FY2021-FY2023. Trailing twelve month period (TTM ended September 30, 2024) is unaudited and prepared on a basis consistent with prior periods.\",,\"See financial statements folder tab 3.1.\"\nFIN-002,Revenue,\"Provide revenue by service line for the TTM period ended September 30, 2024.\",\"TTM revenue was approximately $127,100,000, comprised of waste management, remediation, industrial/field services, transportation, emergency response and facility services.\",\"127100000\",\"Revenue tied to general ledger and job costing system.\"\nFIN-003,Customer Concentration,\"Provide revenue by customer for the TTM period and identify the top ten customers.\",\"Top ten customers represented approximately 67% of TTM revenue. The two largest customers were the U.S. Department of Energy ($24,400,000; 19.2%) and Consolidated Mining Corp. ($14,500,000; 11.4%).\",\"38800000\",\"Customer revenue schedules provided under tab 5 (customer contracts).\"\nFIN-004,Adjusted EBITDA,\"Provide reported EBITDA and a reconciliation of reported EBITDA to adjusted EBITDA for the TTM period.\",\"Reported EBITDA for the TTM period was $18,400,000. Management proposes the adjustments set forth below (FIN-005 through FIN-009). Total adjustments equal $5,400,000, resulting in adjusted EBITDA of $23,800,000.\",\"18400000\",\"Reported EBITDA is earnings before interest, taxes, depreciation and amortization.\"\nFIN-005,EBITDA Adjustment,\"Provide the amount and support for the litigation settlement adjustment.\",\"Adjustment of $1,200,000 relates to a one-time settlement of a 2021 historical commercial contract dispute (Rocky Environmental Services, Inc. v. Anvil Fabrication Co.). The matter was settled in 2023 and does not relate to ongoing operations.\",\"1200000\",\"Settlement agreement dated June 2023, tab 12 (litigation). Not related to any current environmental regulatory matter.\"\nFIN-006,EBITDA Adjustment,\"Provide the amount and support for the owner compensation normalization adjustment.\",\"Adjustment of $950,000 reflects the difference between compensation paid to the selling shareholder(s) and market-rate compensation that a buyer would pay for comparable roles.\",\"950000\",\"Based on management's estimate of market compensation; support provided by compensation study.\"\nFIN-007,EBITDA Adjustment,\"Provide the amount and support for the ERP implementation adjustment.\",\"Adjustment of $650,000 reflects one-time costs associated with implementation of the Company's enterprise resource planning system, including configuration, data migration and training.\",\"650000\",\"ERP go-live occurred in 2024; costs are non-recurring.\"\nFIN-008,EBITDA Adjustment,\"Provide the amount and support for the Pinnacle acquisition-related expenses.\",\"Adjustment of $800,000 reflects integration and transaction-related costs arising from the Company's acquisition of Pinnacle Waste Solutions, LLC.\",\"800000\",\"Pinnacle acquisition closed March 2022; amounts represent one-time integration expenses incurred in the period.\"\nFIN-009,EBITDA Adjustment,\"Provide the amount and support for the asbestos abatement wind-down adjustment.\",\"Adjustment of $1,800,000 reflects costs associated with the wind-down and exit of the Company's asbestos abatement service line. The Company conducted asbestos abatement activities from 2012 through 2023 and discontinued that service line in 2023. Management considers these costs non-recurring. This is the largest individual EBITDA add-back.\",\"1800000\",\"Service line discontinued 2023; remaining costs relate to final demobilization, equipment disposal and closure of related work in process.\"\nFIN-010,EBITDA Summary,\"Confirm total adjustments and resulting adjusted EBITDA.\",\"Total adjustments of $5,400,000; adjusted EBITDA of $23,800,000.\",\"5400000\",\"Sum of FIN-005 through FIN-009. See EBITDA reconciliation workpaper tab 4.2.\"\nFIN-011,Working Capital,\"Provide a monthly working capital rollforward for the TTM period.\",\"Monthly working capital rollforward provided; normalized working capital ranges between approximately $16,000,000 and $19,000,000.\",\"16000000\",\"Ties to general ledger and management reporting.\"\nFIN-012,Indebtedness,\"Provide a schedule of outstanding indebtedness as of the most recent month end.\",\"Outstanding indebtedness consists of a revolver and a term loan with High Plains Bank, N.A. See credit agreement tab 6.\",\"38700000\",\"Interest rates, maturity and covenants described in credit agreement.\"\nFIN-013,Capital Expenditures,\"Provide capital expenditures by category for FY2021-TTM.\",\"Maintenance capital expenditures approximated $3,980,000 (FY2021), $4,180,000 (FY2022), $4,050,000 (FY2023) and $4,320,000 (TTM). Growth capital expenditures and total capital expenditures provided in the fixed asset schedule.\",\"4320000\",\"See fleet and fixed asset schedule tab 9.\"\nFIN-014,Contingencies,\"Identify any material contingencies, including pending litigation and regulatory matters.\",\"The Company is party to various routine matters arising in the ordinary course. Certain matters are described in the data room litigation and regulatory schedule. No specific balance-sheet reserve has been recorded for asserted penalties in the noted regulatory matter.\",\"\",\"Discussions on certain regulatory matters remain ongoing. Refer to litigation and regulatory schedule tab 12.\"\nFIN-015,Environmental,\"Provide the Company's environmental remediation accrual balance.\",\"The Company's environmental remediation accrual is approximately $3,200,000 across all facilities combined.\",\"3200000\",\"Accrual reflects management's estimate of probable and estimable remediation obligations across the portfolio.\"\nFIN-016,Compliance,\"Confirm whether any existing EBITDA adjustment duplicates a balance-sheet accrual.\",\"The EBITDA adjustments set forth above relate to period costs and do not duplicate any balance-sheet accrual.\",\"\",\"No cross-accrual identified by management.\"\nFIN-017,Add-Backs,\"Confirm that all proposed add-backs are supported and complete.\",\"Management confirms that the proposed add-backs are complete and supported by the documentation provided.\",\"\",\"Prepared by corporate controller; reviewed by CFO.\"\nFIN-018,Accounts Receivable,\"Provide an aged accounts receivable listing and bad debt history.\",\"Aged AR listing provided; days sales outstanding approximates 47 days. Bad debt expense has been de minimis.\",\"\",\"AR aging as of September 30, 2024.\"\nFIN-019,Prepared By,\"Confirm the preparer of this response and date of submission.\",\"Prepared by the Office of the Corporate Controller, Rocky Environmental Services, Inc.; submitted to Certain Point Partners LLC for distribution to Sycamore Capital Partners and Thornfield & Associates LLP.\",\"\",\"Submitted January 2025.\"\n"], "locator": "lignes", "unread_units": [], "extraction": "extraite", "reason": "", "duplicate_of": null, "decision": "à examiner", "decision_reason": "", "parent": null, "consulted": false, "signature": "non vérifiée"}], "findings": [{"id": "DD-001", "topic": "Remboursement lors du changement de contrôle", "workstream": "Financement", "priority": "Élevée", "statement": "Les extraits du crédit prévoient un remboursement intégral des prêts cinq jours ouvrés après un changement de contrôle et l’arrêt immédiat des engagements du prêteur.", "impact": "Le financement de la réalisation doit intégrer le remboursement éventuel. Le montant à décaisser et les consentements disponibles restent à confirmer dans le contrat complet et le décompte du prêteur.", "recommendation": "Obtenir le contrat complet, les avenants et le décompte de remboursement ; faire confirmer par le juriste le consentement bancaire ou le refinancement à prévoir avant la réalisation.", "question": "Merci de fournir le contrat signé et ses avenants, les consentements bancaires et un décompte de remboursement à la date de réalisation.", "selection_reason": "Disposition contractuelle plus précise qu’une présentation générale de la dette ; seules des pages extraites ont été fournies.", "consulted": ["credit-agreement.txt"], "evidence": [{"path": "credit-agreement.txt", "sha256": "f80ed66a78db0791d1442a65aedccd800ce869414d84bbcf1b0de86e23138441", "clause": "Section 2.06(a) et (b)", "line_start": 157, "line_end": 164, "quote": "(a)  The Borrower shall repay the Loans in full, together with accrued and\n         unpaid interest, all fees and any amounts payable under Section 2.05,\n         on the da const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='findings',selected=data.findings[0]?.id,dirty=false;
function badge(text,cls=''){return `<span class="badge ${cls}">${esc(text)}</span>`}
function stats(){ $('#stats').innerHTML=[[data.documents.length,'Pièces inventoriées'],[data.documents.filter(d=>d.consulted).length,'Consultations déclarées'],[data.findings.filter(f=>f.validation==='validé').length+'/'+data.findings.length,'Constats validés'],[data.documents.filter(d=>d.extraction!=='extraite').length,'Pièces avec limite de lecture']].map(([n,t])=>`<div class="stat"><strong>${n}</strong>${t}</div>`).join(''); }
function changed(){dirty=true;document.querySelectorAll('[data-id]').forEach(b=>{const f=data.findings.find(f=>f.id===b.dataset.id);b.querySelector('p').textContent=f.statement;const badge=b.querySelectorAll('.badge')[2];badge.textContent=f.validation;badge.classList.toggle('valid',f.validation==='validé')});$('#status').textContent=data.local_server?'Corrections en mémoire. Enregistrez pour actualiser le rapport Word et les tableaux Excel.':'Corrections en mémoire. Enregistrez le JSON puis régénérez les exports pour les inclure dans Word et Excel.';$('#word').classList.add('hidden');$('#excel').classList.add('hidden');stats();}
function match(obj){return JSON.stringify(obj).toLocaleLowerCase('fr').includes($('#search').value.toLocaleLowerCase('fr'));}
function grid(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function render(){stats();$('#filter').classList.toggle('hidden',tab!=='findings');const target=$('#content');
 if(tab==='documents'){target.innerHTML=grid(['Pièce','Extraction','Consultation','Décision et motif','Limites / lien'],data.documents.filter(match).map(d=>[d.path,d.extraction,d.consulted?'Déclarée':'Non déclarée',d.decision+' — '+d.decision_reason,[d.reason,d.parent?'Contrat parent : '+data.documents.find(p=>p.id===d.parent)?.path:'','Signature non vérifiée'].filter(Boolean).join('\n')]));return;}
 if(tab==='questions'){target.innerHTML=grid(['Constat','Question au vendeur','Réponse vendeur','Référence','Suivi'],data.findings.filter(f=>f.question&&match(f)).map(f=>[f.id,f.question,f.seller_response||'En attente',f.response_source||'—',f.seller_response?'Déclaration à recouper':'À relancer']));return;}
 if(tab==='changes'){target.innerHTML=data.changes.length?grid(['Pièce','Changement'],data.changes.filter(match).map(c=>[c.path,c.status])):'<div class="empty">Premier inventaire ou aucun changement détecté. Comparer un versement avec <code>--previous review.json</code> pour identifier les ajouts, modifications et retraits.</div>';return;}
 const rows=data.findings.filter(f=>match(f)&&(!$('#filter').value||f.validation===$('#filter').value));
 if(!rows.length){target.innerHTML='<div class="empty">Aucun constat ne correspond aux filtres.</div>';return;}
 if(!rows.some(f=>f.id===selected))selected=rows[0].id;
 target.innerHTML=`<div class="review"><div class="list">${rows.map(f=>`<button class="finding ${f.id===selected?'selected':''}" data-id="${esc(f.id)}">${badge(f.id)}${badge(f.priority,f.priority==='Critique'?'critical':'high')}<h3>${esc(f.topic)}</h3><p>${esc(f.statement)}</p>${badge(f.validation,f.validation==='validé'?'valid':'')}<span class="meta">${f.evidence.length} passage(s) · ${esc(f.workstream)}</span></button>`).join('')}</div><article class="panel" id="detail"></article></div>`;
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});detail();}
function detail(){const f=data.findings.find(f=>f.id===selected);$('#detail').innerHTML=`<div class="eyebrow">${esc(f.id)} · Vérification ciblée</div><h2>${esc(f.topic)}</h2><label for="statement">Texte repris dans le rapport</label><textarea id="statement">${esc(f.statement)}</textarea><div class="pair"><div><h3>Impact à apprécier</h3><p>${esc(f.impact)}</p></div><div><h3>Suite proposée</h3><p>${esc(f.recommendation)}</p></div></div><h3>Passages retenus</h3>${f.evidence.map(e=>`<div class="proof"><div class="meta">${esc(e.path)}<br>${esc(e.location)} · ${esc(e.clause)}</div><blockquote>${esc(e.quote)}</blockquote>${badge(e.verified?'Citation retrouvée dans le passage':'Preuve à reprendre',e.verified?'valid':'error')}${e.error?`<p>${esc(e.error)}</p>`:''}<details><summary>Voir le contexte extrait</summary><pre>${esc(e.passage)}</pre></details></div>`).join('')}<p class="meta"><b>Pourquoi cette source</b><br>${esc(f.selection_reason)}</p><details><summary>Documents consultés et constats liés</summary><p class="meta">${f.consulted.map(esc).join('<br>')}</p><p>${(f.links||[]).map(esc).join(', ')||'Aucun renvoi'}</p></details><label for="response">Réponse du vendeur à recouper</label><textarea id="response">${esc(f.seller_response||'')}</textarea><label for="responseSource">Référence de la réponse</label><input id="responseSource" value="${esc(f.response_source||'')}" placeholder="Pièce, courriel ou référence Q&A"><label for="reviewer">Nom du relecteur</label><input id="reviewer" value="${esc(f.reviewer||'')}" placeholder="Requis pour valider"><div class="actions" style="margin-top:16px"><button class="primary" id="validate" ${f.errors.length?'disabled':''}>Valider ce constat</button><button id="correct">À corriger</button></div><p class="meta">La validation porte sur le constat. Elle ne certifie pas l’exhaustivité du dossier.</p>`;
 $('#statement').oninput=e=>{f.statement=e.target.value;f.validation='à corriger';changed()};
 $('#response').oninput=e=>{f.seller_response=e.target.value;f.validation='à valider';changed()};
 $('#responseSource').oninput=e=>{f.response_source=e.target.value;f.validation='à valider';changed()};
 $('#validate').onclick=()=>{if(!$('#reviewer').value.trim()||!f.statement.trim()){alert('Renseignez le nom du relecteur et un constat non vide.');return} f.reviewer=$('#reviewer').value.trim();f.reviewed_at=new Date().toISOString();f.validation='validé';changed();render()};
 $('#correct').onclick=()=>{f.validation='à corriger';changed();render()};}
$('#title').textContent=data.mission.title;$('#scope').textContent=data.mission.client+' · Situation au '+data.mission.as_of+' · '+data.mission.scope;
$('#notice').textContent=(data.draft?'Brouillon — revue partielle ou validations en attente. ':'Constats validés dans le périmètre déclaré. ')+'Une citation retrouvée est un contrôle technique. Les pièces extraites ne sont pas nécessairement consultées ; les signatures restent à vérifier.';
$('#limits').innerHTML='<b>Périmètre et limites</b><br>'+data.limitations.map(esc).join('<br>')+'<br>Les numéros de lignes renvoient au texte extrait. Seuls les PDF possèdent une pagination source.';
$('#search').oninput=render;$('#filter').onchange=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#save').onclick=async()=>{const payload={...data.mission,limitations:data.limitations,documents:Object.fromEntries(data.documents.filter(d=>d.decision_reason).map(d=>[d.path,{decision:d.decision,reason:d.decision_reason,sha256:d.sha256,...(d.parent?{parent:data.documents.find(p=>p.id===d.parent).path}:{})}])),findings:data.findings.map(f=>({...f,validation:f.validation==='à reprendre'?'à valider':f.validation,evidence:f.evidence.map(({verified,location,passage,error,document_id,...e})=>e)}))};if(data.local_server){try{const response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:payload,revision:data.generated_at})});const result=await response.json();if(!response.ok)throw Error(result.error);dirty=false;location.reload();}catch(error){$('#status').textContent=error.message;}return;}const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dossier-revu.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);dirty=false;$('#status').textContent='JSON téléchargé. Régénérez avec --case dossier-revu.json pour appliquer les corrections aux exports.';};
if(data.local_server){$('#save').textContent='Enregistrer et actualiser les exports';}
if(!data.office_exports){$('#word').classList.add('hidden');$('#excel').classList.add('hidden');}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});render();
