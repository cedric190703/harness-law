name: Revue de due diligence
on:
  pull_request:
    paths: ['due_diligence/**', '.github/workflows/due-diligence.yml']
  push:
    branches: [main]
    paths: ['due_diligence/**', '.github/workflows/due-diligence.yml']
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r due_diligence/requirements.txt
      - run: python -m unittest discover -s due_diligence/tests -v
